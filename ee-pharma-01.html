<style>
/* Phong cách A · Rõ ràng: nền sáng, Arimo/Arial, nút gần vuông (bo 4px), không logo STELLA, không Navy/Gold */
:root{--bg:#F4F6FA;--card:#FFFFFF;--soft:#F9FAFB;--chip:#F3F4F6;--line:#E5E7EB;--line2:#D1D5DB;--ink:#111827;--ink2:#374151;--muted:#4B5563;
--accent:#1D4ED8;--accent-ink:#FFFFFF;--accent-text:#1D4ED8;--tint:#E3EAFB;
--ok:#15803D;--okbg:#DCFCE7;--okline:#86EFAC;--oktext:#14532D;--okbox:#F0FDF4;
--bad:#B91C1C;--badbg:#FEF2F2;--badline:#FCA5A5;--badtext:#7F1D1D;
--sh:#9A3412;--shbg:#FFF7ED;--shline:#FDBA74;
--ac-bg:#DBEAFE;--ac:#1E40AF;--rd-bg:#CCFBF1;--rd:#115E59;--pr-bg:#FFEDD5;--pr:#9A3412;
--focus:#1D4ED8;color-scheme:light}
[data-theme=dark]{--bg:#0F141B;--card:#171D26;--soft:#1C2330;--chip:#232B38;--line:#2B3442;--line2:#3D4858;--ink:#E7ECF2;--ink2:#CBD3DD;--muted:#A7B2BF;
--accent:#2F62D6;--accent-ink:#FFFFFF;--accent-text:#93B6FF;--tint:#1E2B47;
--ok:#4ADE80;--okbg:#12301F;--okline:#2F7A4B;--oktext:#A7F3C0;--okbox:#10271A;
--bad:#F87171;--badbg:#3A1717;--badline:#8A3434;--badtext:#FECACA;
--sh:#FDBA74;--shbg:#3A2412;--shline:#8A5426;
--ac-bg:#1E2F57;--ac:#C7D7FF;--rd-bg:#123B38;--rd:#99F6E4;--pr-bg:#3D2614;--pr:#FDBA74;
--focus:#93B6FF;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;height:100%;scroll-padding-bottom:76px}
body{margin:0;min-height:100%;min-height:100dvh;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);
  font:16px/1.55 Arimo,Arial,"Helvetica Neue",sans-serif;overflow-wrap:break-word}
p,h1,h2,h3,h4,li,.en,.vi,.opt,.tile,.seg,.fb,.wrong,.right{overflow-wrap:anywhere}
td,th{overflow-wrap:break-word}
button,select{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}
svg{flex:none}
img,svg{max-width:100%}
a{color:var(--accent-text)}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.hide{display:none!important}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- đầu trang ---------- */
header.top{order:0;background:var(--card);border-bottom:1px solid var(--line);padding:12px max(12px,calc((100% - 1100px)/2)) 10px}
.h-grid{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"mark title title" "bar bar tools";gap:8px 12px;align-items:center}
.mark{grid-area:mark}.h-title{grid-area:title}.h-tools{grid-area:tools}.h-bar{grid-area:bar}
@media(min-width:600px){.h-grid{grid-template-areas:"mark title tools" "bar bar bar";gap:10px 16px}}
.mark{width:40px;height:40px;border-radius:4px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;flex:none;letter-spacing:-.02em}
.h-title{min-width:0}
.h-title h1{font-size:16px;line-height:1.3;margin:0;font-weight:700}
.h-sub{font-size:13px;color:var(--muted);margin-top:2px}
.h-tools{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:8px;justify-self:end;min-width:0}
@media(max-width:599px){.h-grid{grid-template-areas:"mark title title" "tools tools tools" "bar bar bar"}.h-tools{justify-self:stretch;justify-content:flex-start}}
.vbtn{flex-direction:column;align-items:flex-start;justify-content:center;gap:0;padding:3px 10px;max-width:220px;text-align:left}
.vbtn small{font-size:12px;line-height:1.2;color:var(--muted)}
.vbtn b{font-size:14px;line-height:1.25;font-weight:600;overflow-wrap:anywhere}
.h-lbl{font-size:13px;color:var(--muted)}
select{min-height:44px;font-size:16px;padding:0 8px;border:1px solid var(--line2);border-radius:4px;background:var(--card);color:var(--ink)}
.h-bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.h-bar>i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
@media(max-width:599px){.h-lbl,.t-lbl{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}}
@media(min-width:600px){.h-title h1{font-size:18px}.mark{width:44px;height:44px;font-size:18px}}

/* ---------- chọn Unit ---------- */
nav.units{order:1;background:var(--card);border-bottom:1px solid var(--line);display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;
  padding:8px max(12px,calc((100% - 1100px)/2));scrollbar-width:thin}
nav.units button{flex:none;min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:4px;background:var(--card);color:var(--ink2);font-size:14px;white-space:nowrap}
nav.units button[aria-current=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}

/* ---------- mục trong Unit: thanh dưới (điện thoại), dải trên (máy tính) ---------- */
nav.sub{order:10;position:-webkit-sticky;position:sticky;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;padding:4px 6px;padding-bottom:calc(4px + env(safe-area-inset-bottom))}
nav.sub button{min-height:52px;min-width:44px;border:0;border-radius:4px;background:transparent;color:var(--muted);font-size:12px;line-height:1.15;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:2px 0;text-align:center}
nav.sub button[aria-current=true]{color:var(--accent-text);background:var(--tint);font-weight:700}
nav.sub .s-long{display:none}
@media(max-width:300px){nav.sub button{font-size:11px}}
@media(min-width:900px){
  html{scroll-padding-bottom:0;scroll-padding-top:76px}
  nav.sub{order:2;top:0;bottom:auto;display:flex;flex-wrap:wrap;border-top:0;border-bottom:1px solid var(--line);padding:8px max(12px,calc((100% - 1100px)/2))}
  nav.sub button{flex-direction:row;gap:8px;min-height:44px;padding:0 16px;font-size:14px;color:var(--ink2);border:1px solid var(--line);background:var(--card)}
  nav.sub button[aria-current=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
  nav.sub .s-long{display:inline}nav.sub .s-short{display:none}
}
@media(max-height:500px){
  nav.sub{position:static;order:2;display:flex;flex-wrap:wrap;border-top:0;border-bottom:1px solid var(--line);padding:8px max(12px,calc((100% - 1100px)/2))}
  nav.sub button{flex-direction:row;gap:6px;min-height:44px;padding:0 12px;font-size:14px;border:1px solid var(--line);background:var(--card)}
  nav.sub button[aria-current=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  html{scroll-padding-top:0;scroll-padding-bottom:0}}

.demo{order:3;background:var(--shbg);color:var(--sh);border-bottom:1px solid var(--shline);font-size:13px;font-weight:700;letter-spacing:.04em;
  padding:6px max(12px,calc((100% - 1100px)/2))}
main{order:4;flex:1 0 auto;width:100%;max-width:1100px;margin:0 auto;padding:16px 12px 28px}
@media(min-width:600px){main{max-width:1132px;padding:20px 16px 32px}}

/* ---------- khối chung ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px;margin:0 0 12px}
@media(min-width:600px){.card{padding:20px 24px;margin-bottom:16px}}
.card p{margin:0 0 10px}
.card>:first-child{margin-top:0}.card>:last-child{margin-bottom:0}
h2,h3,h4{line-height:1.3}
.card h2{font-size:20px;margin:0 0 8px}
.card h3{font-size:17px;margin:0 0 10px}
.eyebrow{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
h2.sec{font-size:20px;margin:2px 0 6px}
@media(min-width:600px){h2.sec{font-size:22px}}
.muted{color:var(--muted)}
.small{font-size:14px}
.notice{background:var(--soft);border:1px solid var(--line);border-radius:4px;padding:10px 12px;margin:0 0 12px;font-size:14px;color:var(--ink2)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.stack{display:flex;flex-direction:column;gap:8px}
.chip{display:inline-block;background:var(--chip);color:var(--ink2);border-radius:3px;padding:4px 10px;font-size:14px;line-height:1.4}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 0}
.divider{height:1px;background:var(--line);margin:16px 0}
.btn{min-height:44px;min-width:44px;padding:0 14px;border:1px solid var(--line2);border-radius:4px;background:var(--card);color:var(--ink);
  font-size:15px;line-height:1.25;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center;text-decoration:none}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.tint{background:var(--tint);border-color:var(--tint);color:var(--accent-text);font-weight:600}
.btn.shd{background:var(--shbg);border-color:var(--shline);color:var(--sh)}
.btn.wide{width:100%}
.btn:disabled{opacity:1}
.btn.primary:disabled{opacity:.5}
.bar{height:8px;border-radius:3px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent)}
.linkbtn{display:flex;align-items:center;gap:10px;min-height:44px;padding:8px 12px;border:1px solid var(--line2);border-radius:4px;background:var(--card);
  color:var(--accent-text);text-decoration:none;font-weight:600;font-size:15px}
.linkbtn small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.links{display:flex;flex-direction:column;gap:8px;margin:10px 0 0}
@media(min-width:600px){.links{flex-direction:row;flex-wrap:wrap}}

/* ---------- Tổng quan ---------- */
.route{display:flex;flex-direction:column;gap:0}
.route-item{padding:14px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center}
.route-item:first-of-type{border-top:0;padding-top:4px}
.route-item .bar{grid-column:1 / -1}
.route-item .rt{font-weight:700}

/* ---------- Unit ---------- */
.unit-head{margin:0 0 14px}
.unit-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:16px 20px;align-items:start}
.unit-main>:last-child{margin-bottom:0}
@media(min-width:1100px){.unit-grid{grid-template-columns:minmax(0,1fr) 300px}}
.switch{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:0 0 12px}
.switch button{min-height:44px;border:1px solid var(--line2);border-radius:4px;background:var(--card);color:var(--ink2);font-size:15px;padding:4px 8px}
.switch button[aria-current=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
input[type=search]{width:100%;min-height:44px;padding:8px 12px;border:1px solid var(--line2);border-radius:4px;background:var(--card);color:var(--ink);font:inherit;font-size:16px;margin:0 0 12px}

/* thẻ từ vựng */
.v-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:10px 12px}
.v-top>div{min-width:0}
.word,.card h3.word{font-size:32px;line-height:1.1;font-weight:700;margin:4px 0;color:var(--ink)}
@media(min-width:600px){.word,.card h3.word{font-size:40px}}
.ipa{color:var(--ink2);font-size:15px}
.say{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:14px 0}
@media(min-width:600px){.say{display:flex;flex-wrap:wrap}.say .btn{padding:0 18px}}
.meaning{margin:0 0 8px;font-size:16px}
.ex-title{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.ex{padding:14px 0 0;margin-top:14px;border-top:1px solid var(--line)}
.ex-title+.ex{border-top:0;margin-top:0;padding-top:4px}
.ctx{display:inline-block;padding:3px 10px;border-radius:3px;font-size:12.5px;font-weight:600;background:var(--ac-bg);color:var(--ac)}
.ctx.rd{background:var(--rd-bg);color:var(--rd)}.ctx.professional{background:var(--pr-bg);color:var(--pr)}
.ex .en{font-weight:600;font-size:17px;line-height:1.5;margin:8px 0 2px}
.ex .vi{color:var(--muted);font-size:15px;margin:0 0 10px}
.ex-btns{display:flex;flex-wrap:wrap;gap:8px}
.ex-btns>.btn{flex:1 1 44px}
.shadow-wrap{flex:1 1 112px;display:flex;flex-direction:column;gap:6px;min-width:0}
.shadow-wrap .btn{width:100%}
@media(min-width:600px){.ex-btns>.btn{flex:0 0 auto}.shadow-wrap{flex:0 1 auto}}
.shadow-bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.shadow-bar>i{display:block;height:100%;width:0;background:var(--sh)}
.trapnote{margin-top:14px}

/* phản hồi, bẫy Vietlish */
.fb{margin-top:10px;padding:12px 14px;border-radius:4px;font-size:15px;line-height:1.55}
.fb.ok{background:var(--okbox);border:1px solid var(--okline);color:var(--oktext)}
.fb.bad{background:var(--badbg);border:1px solid var(--badline);color:var(--badtext)}
.trap{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
@media(min-width:640px){.trap{grid-template-columns:1fr 1fr}}
.wrong,.right{border-radius:4px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start}
.wrong{background:var(--badbg);border:1px solid var(--badline);color:var(--badtext)}
.right{background:var(--okbox);border:1px solid var(--okline);color:var(--oktext)}
.wrong svg{color:var(--bad);margin-top:2px}.right svg{color:var(--ok);margin-top:2px}
.lab{display:block;font-size:13px;font-weight:700}
.trap .txt{font-size:16px}

/* bài tập */
.ex-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin:0 0 10px}
.ex-head strong{font-size:17px}
.tag{display:inline-block;padding:4px 10px;border-radius:3px;background:var(--chip);color:var(--ink2);font-size:13px}
.tag.done{background:var(--okbg);color:var(--oktext)}
.prompt{font-size:17px;line-height:1.6;margin:0 0 12px}
.opts{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.opts.two{grid-template-columns:repeat(2,minmax(0,1fr))}
@media(min-width:600px){.opts.two{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}}
.opt{display:flex;align-items:center;gap:8px;width:100%;min-height:52px;text-align:left;margin:0;padding:10px 14px;border:1px solid var(--line2);border-radius:4px;background:var(--card);color:var(--ink);font-size:16px;line-height:1.4}
.opts.two .opt{justify-content:center;text-align:center}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{color:var(--ink)}
.opt.ok{background:var(--okbg);border:2px solid var(--ok);color:var(--oktext);font-weight:600}
.opt.bad{background:var(--badbg);border:2px solid var(--bad);color:var(--badtext)}
.cloze{font-size:17px;line-height:1.6;margin:0 0 12px}
button.gap{display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;min-height:44px;min-width:72px;margin:4px;padding:0 10px;
  border:0;border-bottom:2px solid var(--accent);border-radius:4px;background:var(--tint);color:var(--ink);font-weight:600}
button.gap.ok{border-color:var(--ok);background:var(--okbg);color:var(--oktext)}button.gap.bad{border-color:var(--bad);background:var(--badbg);color:var(--badtext)}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.pool .btn:disabled{opacity:.45}
.seg-line{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:17px;margin:0 0 6px}
button.seg{min-height:44px;padding:0 10px;border:1px solid var(--line2);border-radius:4px;background:var(--soft);color:var(--ink);font-size:17px;display:inline-flex;align-items:center;gap:4px}
button.seg sup{font-size:12px;font-weight:700;color:var(--accent-text)}
button.seg.ok{background:var(--okbg);border:2px solid var(--ok);color:var(--oktext)}button.seg.bad{background:var(--badbg);border:2px solid var(--bad);color:var(--badtext)}
button.seg:disabled{color:var(--ink)}
button.seg.ok:disabled{color:var(--oktext)}button.seg.bad:disabled{color:var(--badtext)}
.tilebox{min-height:64px;border:2px dashed var(--line2);border-radius:4px;padding:8px;margin:8px 0;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tilebox.answer{background:var(--soft)}
.tilebox:empty::before{content:attr(data-ph);color:var(--muted);font-size:14px;padding:0 4px}
.tile{min-height:44px;min-width:44px;padding:0 12px;border:1px solid var(--accent);border-radius:4px;background:var(--card);color:var(--ink);font-size:16px}
.tilebox.answer .tile{background:var(--tint)}

/* flashcards 3D */
.fc{perspective:1000px;margin:0 auto 12px;max-width:560px}
.fc-inner{display:grid;min-height:200px;transform-style:preserve-3d;transition:transform .5s;cursor:pointer;border-radius:6px}
.fc.flipped .fc-inner{transform:rotateY(180deg)}
.face{grid-area:1 / 1;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1px solid var(--line2);border-radius:6px;background:var(--card);padding:22px 18px;
  display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:6px;box-shadow:0 1px 2px rgba(17,24,39,.06)}
.face.back{transform:rotateY(180deg);align-items:flex-start;text-align:left;justify-content:flex-start;border-color:var(--accent)}
.face .hint{font-size:13px;color:var(--muted);margin-top:8px}
@media(min-width:600px){.fc-inner{min-height:260px}}
@media(prefers-reduced-motion:reduce){.fc-inner{transition:none}}
.fc-say{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;max-width:560px;margin:0 auto 12px}
.fc-ctl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;max-width:560px;margin:0 auto}
.fc-ctl .two{grid-column:span 3;display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* sơ đồ ghép từ */
.forks{display:flex;flex-direction:column;gap:12px}
.fork-center{align-self:flex-start;background:var(--accent);color:var(--accent-ink);border-radius:4px;padding:8px 16px;font-weight:700;font-size:18px}
.fork-groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.fork-g{background:var(--soft);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:4px;padding:12px 14px}
.fork-g .lab{color:var(--muted);margin:0 0 8px;font-weight:600}
.fork-g .row .btn{font-size:15px}
.tbl{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{background:var(--soft);color:var(--ink2);font-size:13px;font-weight:700}

/* Góc sửa bài */
.rv-list{display:flex;flex-direction:column;gap:8px}
.rv{border:1px solid var(--line);border-radius:4px;padding:12px 14px;background:var(--soft)}
.rv dl{margin:0;display:grid;grid-template-columns:minmax(0,1fr);gap:2px 12px}
@media(min-width:600px){.rv dl{grid-template-columns:140px minmax(0,1fr)}}
.rv dt{font-size:13px;color:var(--muted);font-weight:600}
.rv dd{margin:0 0 6px}
.rv-h{display:flex;align-items:center;gap:8px}
.rv-h.okc svg{color:var(--ok)}.rv-h.badc svg{color:var(--bad)}.rv-h.unk svg{color:var(--muted)}

/* tiến độ bên cạnh */

<script type="application/json" id="spec">{"meta":{"id":"ee-pharma-01","title":"Effortless English ngành dược · Bài 1: Introducing myself & my AD work","book":"English for Pharmaceutical Professionals","series":"Effortless English ngành dược","level":"B1–B2","note":"Bài học tự giới thiệu bản thân và công việc phát triển phương pháp phân tích, theo phương pháp Effortless English.","source":{"kind":"upload","book":"English for Pharmaceutical Professionals","unit":"Bài 1"}},"units":[{"id":"bai-1","label":"Bài 1","title":"Introducing myself & my AD work","goal":"Tự giới thiệu trôi chảy về nghề dược sĩ và công việc phát triển phương pháp phân tích, bằng những câu ngắn, tự nhiên như khi nói.","story":{"title":"Introducing myself & my AD work","intro":"Một lời tự giới thiệu ngắn về nghề dược sĩ và công việc ở phòng Phát triển phân tích, để nghe đi nghe lại cho đến khi nói ra được một cách tự nhiên.","days":14,"pause_s":5,"plan_note":"Ngày 1–2: nghe câu chuyện chính có chữ và tiếng Việt. Từ ngày 3: bấm “Ẩn chữ tiếng Anh” để chỉ nghe, rồi làm mini-story hỏi–đáp. Cuối mỗi tuần (ngày 7 và 14): nghe point of view và làm bài tập. Khi nghe hiểu ngay mà không cần dịch, bấm “Đánh dấu: đã hiểu ngay, không cần dịch”.","main":[{"text":"Hi, my name is Son, and I'm a pharmacist.","vi":"Xin chào, tên tôi là Sơn, và tôi là dược sĩ."},{"text":"I graduated from Hanoi University of Pharmacy.","vi":"Tôi tốt nghiệp Trường Đại học Dược Hà Nội."},{"text":"I have six years of hands-on experience in pharmaceutical analysis.","vi":"Tôi có sáu năm kinh nghiệm thực hành trong phân tích dược phẩm."},{"text":"I work at a pharmaceutical company in Vietnam.","vi":"Tôi làm việc tại một công ty dược phẩm ở Việt Nam."},{"text":"Our company is EU-GMP certified, which means we comply with strict quality standards.","vi":"Công ty chúng tôi đạt chứng nhận EU-GMP, nghĩa là chúng tôi tuân thủ các tiêu chuẩn chất lượng nghiêm ngặt."},{"text":"I work in the Analytical Development department, or AD for short, which is part of R&D.","vi":"Tôi làm việc ở phòng Phát triển phân tích, gọi tắt là AD, thuộc khối R&D."},{"text":"I'm the team lead of Group 1, and I lead a team of four analysts.","vi":"Tôi là trưởng Nhóm 1 và dẫn dắt một nhóm gồm bốn kiểm nghiệm viên."},{"text":"I report to the Department Head.","vi":"Tôi báo cáo cho Trưởng phòng."},{"text":"I'm in charge of our group's projects, and I report on their progress and resource allocation.","vi":"Tôi phụ trách các dự án của nhóm và báo cáo tiến độ cũng như việc phân bổ nguồn lực."},{"text":"My main job is to develop and validate HPLC methods for related substances.","vi":"Công việc chính của tôi là xây dựng và thẩm định các phương pháp HPLC xác định tạp chất liên quan."},{"text":"I use Analytical Quality by Design, or AQbD, and I follow ICH Q14 and ICH Q2(R2).","vi":"Tôi áp dụng Analytical Quality by Design, gọi tắt là AQbD, và tuân theo ICH Q14 và ICH Q2(R2)."},{"text":"I use Design-Expert software for design of experiments, and it helps me come up with robust methods.","vi":"Tôi dùng phần mềm Design-Expert để thiết kế thí nghiệm (DoE), và phần mềm giúp tôi xây dựng được các phương pháp có độ vững cao (robust)."},{"text":"I also design forced degradation studies.","vi":"Tôi cũng thiết kế các nghiên cứu phân hủy cưỡng bức."},{"text":"I evaluate raw material documents from suppliers, such as the COA, the method of analysis, the specification, the monograph, and the CEP.","vi":"Tôi đánh giá hồ sơ nguyên liệu từ nhà cung cấp, như COA, phương pháp phân tích, tiêu chuẩn chất lượng, chuyên luận và CEP."},{"text":"I'm also responsible for writing non-conformance reports.","vi":"Tôi cũng chịu trách nhiệm viết các báo cáo không phù hợp."},{"text":"I work closely with my analysts to make sure our results are reliable.","vi":"Tôi phối hợp chặt chẽ với các kiểm nghiệm viên để bảo đảm kết quả của chúng tôi đáng tin cậy."},{"text":"Another strength of mine is automation: I use Python and Google Apps Script to automate lab paperwork and reports, and this helps us save time.","vi":"Một thế mạnh khác của tôi là tự động hóa: tôi dùng Python và Google Apps Script để tự động hóa giấy tờ và báo cáo của phòng lab, và điều này giúp chúng tôi tiết kiệm thời gian."},{"text":"In the future, I want to grow professionally in an international team and use English every day at work.","vi":"Trong tương lai, tôi muốn phát triển nghề nghiệp trong một đội ngũ quốc tế và dùng tiếng Anh mỗi ngày ở nơi làm việc."}],"mini":[{"q":"Who is Son?","a":"He's a pharmacist.","vi":"Anh ấy là dược sĩ."},{"q":"Is Son a doctor?","a":"No, he isn't a doctor. He's a pharmacist.","vi":"Không, anh ấy không phải bác sĩ. Anh ấy là dược sĩ."},{"q":"Is he a pharmacist or a teacher?","a":"He's a pharmacist.","vi":"Anh ấy là dược sĩ."},{"q":"Is he an engineer?","a":"No, he isn't. He's a pharmacist.","vi":"Không phải. Anh ấy là dược sĩ."},{"q":"Where did he graduate from?","a":"From Hanoi University of Pharmacy.","vi":"Từ Trường Đại học Dược Hà Nội."},{"q":"Did he graduate from a medical school?","a":"No, from Hanoi University of Pharmacy.","vi":"Không, từ Trường Đại học Dược Hà Nội."},{"q":"How many years of experience does he have?","a":"He has six years of experience.","vi":"Anh ấy có sáu năm kinh nghiệm."},{"q":"Does he have two years of experience?","a":"No, he has six years.","vi":"Không, anh ấy có sáu năm."},{"q":"What kind of experience does he have?","a":"Hands-on experience in pharmaceutical analysis.","vi":"Kinh nghiệm thực hành trong phân tích dược phẩm."},{"q":"Where does he work?","a":"At a pharmaceutical company in Vietnam.","vi":"Tại một công ty dược phẩm ở Việt Nam."},{"q":"Is his company a hospital?","a":"No, it's a pharmaceutical company.","vi":"Không, đó là một công ty dược phẩm."},{"q":"Is the company in Vietnam or in Japan?","a":"It's in Vietnam.","vi":"Công ty ở Việt Nam."},{"q":"What certification does the company have?","a":"It has EU-GMP certification.","vi":"Công ty có chứng nhận EU-GMP."},{"q":"Does the company follow strict quality rules?","a":"Yes, it complies with strict standards.","vi":"Có, công ty tuân thủ các tiêu chuẩn nghiêm ngặt."},{"q":"Which department does he work in?","a":"The Analytical Development department.","vi":"Phòng Phát triển phân tích."},{"q":"What does AD stand for?","a":"Analytical Development.","vi":"Phát triển phân tích."},{"q":"Is AD a sales department?","a":"No, it's part of R&D.","vi":"Không, phòng này thuộc khối R&D."},{"q":"What is his role in Group 1?","a":"He's the team lead.","vi":"Anh ấy là trưởng nhóm."},{"q":"Is he a team member or a team lead?","a":"He's a team lead.","vi":"Anh ấy là trưởng nhóm."},{"q":"Does he lead a big team or a small team?","a":"A small team of four analysts.","vi":"Một nhóm nhỏ gồm bốn kiểm nghiệm viên."},{"q":"How many analysts does he lead?","a":"He leads four analysts.","vi":"Anh ấy dẫn dắt bốn kiểm nghiệm viên."},{"q":"Does he lead ten analysts?","a":"No, he leads four.","vi":"Không, anh ấy dẫn dắt bốn người."},{"q":"Who does he report to?","a":"He reports to the Department Head.","vi":"Anh ấy báo cáo cho Trưởng phòng."},{"q":"Does he report to the Department Head or to his analysts?","a":"To the Department Head.","vi":"Cho Trưởng phòng."},{"q":"What is he in charge of?","a":"He's in charge of his group's projects.","vi":"Anh ấy phụ trách các dự án trong nhóm."},{"q":"What does he report on?","a":"Project progress and resource allocation.","vi":"Tiến độ dự án và việc phân bổ nguồn lực."},{"q":"What is his main job?","a":"He develops and validates HPLC methods.","vi":"Anh ấy xây dựng và thẩm định các phương pháp HPLC."},{"q":"What are his HPLC methods for?","a":"They're for related substances.","vi":"Để xác định tạp chất liên quan."},{"q":"Which approach does he use?","a":"He uses AQbD.","vi":"Anh ấy dùng AQbD."},{"q":"Which guidelines does he follow?","a":"ICH Q14 and ICH Q2(R2).","vi":"ICH Q14 và ICH Q2(R2)."},{"q":"What software does he use for design of experiments?","a":"He uses Design-Expert.","vi":"Anh ấy dùng Design-Expert."},{"q":"Does the software help him come up with robust methods?","a":"Yes, it does.","vi":"Có, phần mềm có giúp anh ấy."},{"q":"What kind of studies does he design?","a":"Forced degradation studies.","vi":"Các nghiên cứu phân hủy cưỡng bức."},{"q":"Does he design clinical trials?","a":"No, he designs forced degradation studies.","vi":"Không, anh ấy thiết kế các nghiên cứu phân hủy cưỡng bức."},{"q":"What documents does he evaluate?","a":"Raw material documents from suppliers.","vi":"Hồ sơ nguyên liệu từ nhà cung cấp."},{"q":"Does he evaluate only the COA?","a":"No. He also evaluates the method of analysis, the specification, the monograph, and the CEP.","vi":"Không. Anh ấy còn đánh giá phương pháp phân tích, tiêu chuẩn chất lượng, chuyên luận và CEP."},{"q":"What reports is he responsible for writing?","a":"Non-conformance reports.","vi":"Các báo cáo không phù hợp."},{"q":"Does he work alone or closely with his team?","a":"He works closely with his team.","vi":"Anh ấy phối hợp chặt chẽ với nhóm của mình."},{"q":"Why does he work closely with his analysts?","a":"To make sure the results are reliable.","vi":"Để bảo đảm kết quả đáng tin cậy."},{"q":"What is another one of his strengths?","a":"Automation.","vi":"Tự động hóa."},{"q":"Which tools does he use for automation?","a":"Python and Google Apps Script.","vi":"Python và Google Apps Script."},{"q":"Does automation waste time or save time?","a":"It saves time.","vi":"Nó tiết kiệm thời gian."},{"q":"What language does he want to use every day at work?","a":"He wants to use English.","vi":"Anh ấy muốn dùng tiếng Anh."}],"pov":[{"label":"Ngôi thứ ba","intro":"Cùng câu chuyện đó nhưng kể về Sơn (he, his), chủ yếu ở thì hiện tại đơn (riêng việc tốt nghiệp dùng quá khứ đơn).","sentences":[{"text":"Son is a pharmacist, and he graduated from Hanoi University of Pharmacy.","vi":"Sơn là dược sĩ, và anh ấy tốt nghiệp Trường Đại học Dược Hà Nội."},{"text":"He has six years of hands-on experience in pharmaceutical analysis.","vi":"Anh ấy có sáu năm kinh nghiệm thực hành trong phân tích dược phẩm."},{"text":"He works at a pharmaceutical company in Vietnam with EU-GMP certification.","vi":"Anh ấy làm việc tại một công ty dược phẩm ở Việt Nam có chứng nhận EU-GMP."},{"text":"He is the team lead of Group 1 in the Analytical Development department.","vi":"Anh ấy là trưởng Nhóm 1 của phòng Phát triển phân tích."},{"text":"He leads a team of four analysts, and he reports to the Department Head.","vi":"Anh ấy dẫn dắt một nhóm gồm bốn kiểm nghiệm viên và báo cáo cho Trưởng phòng."},{"text":"He develops and validates HPLC methods for related substances.","vi":"Anh ấy xây dựng và thẩm định các phương pháp HPLC xác định tạp chất liên quan."},{"text":"He uses AQbD, and he follows ICH Q14 and ICH Q2(R2).","vi":"Anh ấy dùng AQbD, và tuân theo ICH Q14 và ICH Q2(R2)."},{"text":"He uses Design-Expert software for design of experiments.","vi":"Anh ấy dùng phần mềm Design-Expert để thiết kế thí nghiệm."},{"text":"He also designs forced degradation studies and evaluates raw material documents from suppliers.","vi":"Anh ấy cũng thiết kế các nghiên cứu phân hủy cưỡng bức và đánh giá hồ sơ nguyên liệu từ nhà cung cấp."},{"text":"He is responsible for writing non-conformance reports, too.","vi":"Anh ấy cũng chịu trách nhiệm viết các báo cáo không phù hợp."},{"text":"He works closely with his team to make sure the results are reliable.","vi":"Anh ấy phối hợp chặt chẽ với nhóm của mình để bảo đảm kết quả đáng tin cậy."},{"text":"He uses Python and Google Apps Script to automate lab paperwork and reports, so his team saves time.","vi":"Anh ấy dùng Python và Google Apps Script để tự động hóa giấy tờ và báo cáo phòng lab, nên nhóm của anh tiết kiệm thời gian."},{"text":"He wants to grow professionally in an international team and use English every day at work.","vi":"Anh ấy muốn phát triển nghề nghiệp trong một đội ngũ quốc tế và dùng tiếng Anh mỗi ngày ở nơi làm việc."}]},{"label":"Trả lời phỏng vấn","intro":"Cùng những thông tin đó, kể chủ yếu bằng thì hiện tại hoàn thành (kèm quá khứ đơn cho việc học và hiện tại đơn cho vai trò hiện nay), như khi trả lời câu hỏi 'Tell me about yourself' trong phỏng vấn.","sentences":[{"text":"I studied pharmacy at Hanoi University of Pharmacy.","vi":"Tôi đã học ngành dược tại Trường Đại học Dược Hà Nội."},{"text":"I have worked in pharmaceutical analysis for six years.","vi":"Tôi đã làm việc trong lĩnh vực phân tích dược phẩm được sáu năm."},{"text":"I have gained hands-on experience in HPLC method development.","vi":"Tôi đã tích lũy kinh nghiệm thực hành về xây dựng phương pháp HPLC."},{"text":"Now I work at a pharmaceutical company in Vietnam with EU-GMP certification.","vi":"Hiện nay tôi làm việc tại một công ty dược phẩm ở Việt Nam có chứng nhận EU-GMP."},{"text":"I have led a team of four analysts in Group 1 of the AD department.","vi":"Tôi đã và đang dẫn dắt một nhóm gồm bốn kiểm nghiệm viên ở Nhóm 1 của phòng AD."},{"text":"In this role, I report to the Department Head.","vi":"Ở vai trò này, tôi báo cáo cho Trưởng phòng."},{"text":"I have developed and validated HPLC methods for related substances.","vi":"Tôi đã xây dựng và thẩm định các phương pháp HPLC xác định tạp chất liên quan."},{"text":"I have applied AQbD following ICH Q14 and ICH Q2(R2), and I have used Design-Expert software for design of experiments.","vi":"Tôi đã áp dụng AQbD theo ICH Q14 và ICH Q2(R2), và đã dùng phần mềm Design-Expert để thiết kế thí nghiệm."},{"text":"I have designed forced degradation studies.","vi":"Tôi đã thiết kế các nghiên cứu phân hủy cưỡng bức."},{"text":"I have evaluated raw material documents from suppliers and written non-conformance reports.","vi":"Tôi đã đánh giá hồ sơ nguyên liệu từ nhà cung cấp và viết các báo cáo không phù hợp."},{"text":"I have also automated lab paperwork and reports with Python and Google Apps Script, and this has saved my team time.","vi":"Tôi cũng đã tự động hóa giấy tờ và báo cáo phòng lab bằng Python và Google Apps Script, và điều này đã giúp nhóm tôi tiết kiệm thời gian."},{"text":"I would like to grow professionally in an international team and use English every day at work.","vi":"Tôi muốn phát triển nghề nghiệp trong một đội ngũ quốc tế và dùng tiếng Anh mỗi ngày ở nơi làm việc."}]}]},"vocab_items":[{"word":"lead a team of","pos":"phrase (verb)","ipa":"/liːd ə ˈtiːm əv/","meaning_vi":"dẫn dắt một nhóm gồm (số người)","meaning_en":"to be the person in charge of a group of people","native_logic":"Người bản xứ nói lead a team of + số người + danh từ chỉ người: số lượng đi sau 'of', ví dụ 'a team of four analysts'. Động từ lead chia theo chủ ngữ: I lead, he leads.","collocations":["lead a team of four","lead a research team","lead a project","team lead"],"vietlish":"Không nói 'I lead four analysts team'. Hãy nói 'I lead a team of four analysts'.","examples":[{"text":"In many research projects, a senior scientist is expected to lead a team of junior researchers.","vi":"Trong nhiều dự án nghiên cứu, nhà khoa học cấp cao được kỳ vọng dẫn dắt một nhóm các nhà nghiên cứu trẻ.","context":"academic"},{"text":"I lead a team of four analysts who develop HPLC methods for related substances.","vi":"Tôi dẫn dắt một nhóm gồm bốn kiểm nghiệm viên chuyên xây dựng các phương pháp HPLC xác định tạp chất liên quan.","context":"rd"},{"text":"In my current role, I lead a team of analysts and report to the Department Head.","vi":"Ở vai trò hiện tại, tôi dẫn dắt một nhóm kiểm nghiệm viên và báo cáo cho Trưởng phòng.","context":"professional"}]},{"word":"report to","pos":"phrase (verb)","ipa":"/rɪˈpɔːt tuː/","meaning_vi":"báo cáo cho, trực thuộc (cấp trên)","meaning_en":"to have a manager who you answer to; to give information to someone in authority","native_logic":"Trong cơ cấu tổ chức, 'report to' chỉ đường quản lý: ai là cấp trên trực tiếp của bạn. Sau 'to' là người hoặc chức danh: report to the Department Head.","collocations":["report to the manager","report directly to","report to the committee","reporting line"],"vietlish":"'report to' + người: báo cáo cho ai (cấp trên trực tiếp). Muốn nói báo cáo về việc gì thì dùng 'report on' (report on project progress), tự nhiên hơn 'report about'.","examples":[{"text":"Researchers must report to the ethics committee if the study design changes.","vi":"Các nhà nghiên cứu phải báo cáo cho hội đồng đạo đức nếu thiết kế nghiên cứu thay đổi.","context":"academic"},{"text":"Analysts report to the team lead when a system suitability test fails.","vi":"Kiểm nghiệm viên báo cáo cho trưởng nhóm khi phép thử tính phù hợp hệ thống không đạt.","context":"rd"},{"text":"I report to the Department Head and give regular updates on project progress.","vi":"Tôi báo cáo cho Trưởng phòng và cập nhật đều đặn tiến độ dự án.","context":"professional"}]},{"word":"be responsible for","pos":"phrase (adjective + preposition)","ipa":"/biː rɪˈspɒnsəbl fɔː/","meaning_vi":"chịu trách nhiệm về, phụ trách","meaning_en":"to have the duty of doing or looking after something","native_logic":"Sau 'for' là việc hoặc người bạn phải lo: danh từ hoặc V-ing (be responsible for writing reports). Người bản xứ dùng cụm này để nói rõ phạm vi công việc của mình.","collocations":["be responsible for the project","be responsible for ensuring","be fully responsible for","be directly responsible for"],"vietlish":"Không nói 'responsible about' hay 'responsible of'. Luôn dùng 'responsible for'.","examples":[{"text":"The principal investigator will be responsible for the design and the ethical conduct of the study.","vi":"Nghiên cứu viên chính sẽ chịu trách nhiệm về thiết kế và việc thực hiện nghiên cứu đúng đạo đức.","context":"academic"},{"text":"The analyst will be responsible for preparing the mobile phase and the standard solutions.","vi":"Kiểm nghiệm viên sẽ chịu trách nhiệm chuẩn bị pha động và các dung dịch chuẩn.","context":"rd"},{"text":"In an interview, you should be ready to explain what you have been responsible for in your current role.","vi":"Trong phỏng vấn, bạn nên sẵn sàng giải thích mình đã chịu trách nhiệm những gì ở vai trò hiện tại.","context":"professional"}]},{"word":"be in charge of","pos":"phrase (be + in charge + of)","ipa":"/biː ɪn ˈtʃɑːdʒ əv/","meaning_vi":"phụ trách, đứng đầu, quản lý","meaning_en":"to be the person who controls or manages something","native_logic":"Nhấn vào quyền quản lý và điều phối: bạn là người 'cầm lái'. Nói 'in charge of' cho dự án, nhóm, thiết bị; sau 'of' là danh từ hoặc V-ing.","collocations":["be in charge of a project","be in charge of the team","the person in charge","take charge of"],"vietlish":"Không nói 'in charge for'. Luôn dùng 'in charge of'.","examples":[{"text":"The head of department will be in charge of allocating the research budget.","vi":"Trưởng khoa sẽ phụ trách phân bổ ngân sách nghiên cứu.","context":"academic"},{"text":"The senior analyst will be in charge of the forced degradation experiments.","vi":"Kiểm nghiệm viên cao cấp sẽ phụ trách các thí nghiệm phân hủy cưỡng bức.","context":"rd"},{"text":"Being team lead means being in charge of all projects in Group 1.","vi":"Làm trưởng nhóm nghĩa là phụ trách toàn bộ các dự án của Nhóm 1.","context":"professional"}]},{"word":"develop and validate","pos":"phrase (verb + verb)","ipa":"/dɪˈveləp ənd ˈvælɪdeɪt/","meaning_vi":"xây dựng và thẩm định","meaning_en":"to create something and then prove that it works reliably","native_logic":"Hai bước đi liền nhau trong phòng lab: develop (xây dựng phương pháp) rồi validate (chứng minh phương pháp phù hợp mục đích sử dụng). Hai động từ dùng chung một tân ngữ: develop and validate a method.","collocations":["develop and validate a method","develop and validate an HPLC method","develop and validate a procedure","develop and validate a model"],"examples":[{"text":"Researchers often develop and validate new analytical methods before they use them in routine testing.","vi":"Các nhà nghiên cứu thường xây dựng và thẩm định phương pháp phân tích mới trước khi dùng trong kiểm nghiệm thường quy.","context":"academic"},{"text":"We develop and validate stability-indicating HPLC methods for related substances.","vi":"Chúng tôi xây dựng và thẩm định các phương pháp HPLC chỉ thị độ ổn định để xác định tạp chất liên quan.","context":"rd"},{"text":"My main task is to develop and validate methods that meet regulatory requirements.","vi":"Nhiệm vụ chính của tôi là xây dựng và thẩm định các phương pháp đáp ứng yêu cầu quy định.","context":"professional"}]},{"word":"related substances","pos":"noun phrase","ipa":"/rɪˌleɪtɪd ˈsʌbstənsɪz/","meaning_vi":"tạp chất liên quan (tạp chất có cấu trúc gần với hoạt chất)","meaning_en":"impurities that are chemically similar to the active substance","native_logic":"Trong Ph. Eur., BP, JP và hồ sơ đăng ký, 'related substances' là tên chuẩn của phép thử tạp chất hữu cơ (USP hiện dùng tiêu đề 'Organic Impurities'). Tên phép thử luôn ở dạng số nhiều (related substances); khi nói về một tạp riêng lẻ thì dùng 'impurity A' (Ph. Eur.) hoặc 'related compound A' (USP).","collocations":["related substances test","determination of related substances","limit of related substances","HPLC method for related substances"],"examples":[{"text":"Impurity profiling focuses on related substances that form during synthesis or storage.","vi":"Phân tích hồ sơ tạp chất tập trung vào các tạp chất liên quan hình thành trong quá trình tổng hợp hoặc bảo quản.","context":"academic"},{"text":"The method separates all related substances from the main peak with a resolution above 2.0.","vi":"Phương pháp tách tất cả tạp chất liên quan khỏi pic chính với độ phân giải trên 2,0.","context":"rd"},{"text":"Please send me the chromatograms for the related substances test before the meeting.","vi":"Vui lòng gửi tôi các sắc ký đồ của phép thử tạp chất liên quan trước cuộc họp.","context":"professional"}]},{"word":"work closely with","pos":"phrase (verb + adverb + preposition)","ipa":"/wɜːk ˈkləʊsli wɪð/","meaning_vi":"phối hợp chặt chẽ với","meaning_en":"to cooperate with someone in a very direct and regular way","native_logic":"Closely cho thấy mức độ gần gũi và thường xuyên. Trong phỏng vấn, cụm này rất hay được dùng để nói về làm việc nhóm: work closely with my team, with suppliers, with other departments.","collocations":["work closely with colleagues","work closely with the team","work closely with suppliers","work closely together"],"vietlish":"Không nói 'work close with'. Cần trạng từ 'closely'.","examples":[{"text":"Scientists need to work closely with colleagues from other disciplines to solve complex problems.","vi":"Các nhà khoa học cần phối hợp chặt chẽ với đồng nghiệp ở các ngành khác để giải quyết vấn đề phức tạp.","context":"academic"},{"text":"We work closely with the formulation team to understand how excipients affect degradation.","vi":"Chúng tôi phối hợp chặt chẽ với nhóm bào chế để hiểu tá dược ảnh hưởng đến sự phân hủy như thế nào.","context":"rd"},{"text":"I work closely with my team, so everyone knows the project status.","vi":"Tôi phối hợp chặt chẽ với nhóm của mình, nên mọi người đều biết tình trạng dự án.","context":"professional"}]},{"word":"make sure","pos":"phrase (verb)","ipa":"/meɪk ˈʃʊə/","meaning_vi":"bảo đảm, chắc chắn rằng","meaning_en":"to check or act so that something is certain to happen or be true","native_logic":"Sau 'make sure' thường là một mệnh đề (make sure (that) + S + V; that có thể bỏ), hoặc 'make sure to + V' khi nhắc ai làm việc gì, hoặc 'make sure of + danh từ'. Dùng cho nhắc nhở, kiểm tra và cam kết chất lượng: make sure the results are reliable.","collocations":["make sure that","make sure of","make sure the data are accurate","double-check to make sure"],"vietlish":"Không bỏ động từ trong mệnh đề sau make sure: nói 'make sure the results are reliable', không nói 'make sure the results reliable'.","examples":[{"text":"Authors must make sure that all sources are cited correctly.","vi":"Tác giả phải bảo đảm mọi nguồn tài liệu đều được trích dẫn đúng.","context":"academic"},{"text":"Always make sure the column is equilibrated before you inject the standard.","vi":"Luôn bảo đảm cột đã cân bằng trước khi tiêm mẫu chuẩn.","context":"rd"},{"text":"Please make sure the report is signed before it goes to the Department Head.","vi":"Vui lòng bảo đảm báo cáo đã được ký trước khi gửi lên Trưởng phòng.","context":"professional"}]},{"word":"comply with","pos":"phrase (verb)","ipa":"/kəmˈplaɪ wɪð/","meaning_vi":"tuân thủ (quy định, tiêu chuẩn, hướng dẫn)","meaning_en":"to obey a rule, standard, or law","native_logic":"Dùng cho quy định, tiêu chuẩn và hướng dẫn chính thức: comply with GMP, comply with ICH guidelines. Danh từ là compliance (in compliance with).","collocations":["comply with regulations","comply with GMP","comply with guidelines","fail to comply with"],"vietlish":"Không nói 'comply to' hay 'comply the rules'. Luôn dùng 'comply with'.","examples":[{"text":"All studies involving human participants must comply with ethical guidelines.","vi":"Mọi nghiên cứu có người tham gia phải tuân thủ các hướng dẫn về đạo đức.","context":"academic"},{"text":"The validation protocol must comply with ICH Q2(R2) requirements.","vi":"Đề cương thẩm định phải tuân thủ các yêu cầu của ICH Q2(R2).","context":"rd"},{"text":"As an EU-GMP site, we must comply with strict quality and documentation rules.","vi":"Là một cơ sở đạt EU-GMP, chúng tôi phải tuân thủ các quy định nghiêm ngặt về chất lượng và hồ sơ.","context":"professional"}]},{"word":"hands-on experience","pos":"noun phrase","ipa":"/ˌhændz ˈɒn ɪkˈspɪəriəns/","meaning_vi":"kinh nghiệm thực hành trực tiếp","meaning_en":"practical experience of doing something yourself, not only studying it","native_logic":"Nhà tuyển dụng thích cụm này vì nó cho thấy bạn đã tự tay làm. Experience ở nghĩa 'kinh nghiệm' là danh từ không đếm được: hands-on experience in/with + lĩnh vực hoặc thiết bị.","collocations":["hands-on experience in","hands-on experience with HPLC","gain hands-on experience","years of hands-on experience"],"vietlish":"Không nói 'many experiences' khi nói về kinh nghiệm làm việc; dùng 'a lot of experience'.","examples":[{"text":"Graduates with hands-on experience in laboratory work often find jobs more easily.","vi":"Sinh viên tốt nghiệp có kinh nghiệm thực hành ở phòng thí nghiệm thường dễ tìm việc hơn.","context":"academic"},{"text":"He has hands-on experience with HPLC and method troubleshooting.","vi":"Anh ấy có kinh nghiệm thực hành với HPLC và xử lý sự cố phương pháp.","context":"rd"},{"text":"I have six years of hands-on experience in pharmaceutical analysis.","vi":"Tôi có sáu năm kinh nghiệm thực hành trong phân tích dược phẩm.","context":"professional"}]},{"word":"come up with","pos":"phrasal verb","ipa":"/kʌm ˈʌp wɪð/","meaning_vi":"nghĩ ra, đề xuất (ý tưởng, giải pháp, kế hoạch)","meaning_en":"to think of an idea, plan, or solution","native_logic":"Dùng khi một ý tưởng hoặc giải pháp 'xuất hiện' sau khi suy nghĩ hay thử nghiệm. Tân ngữ đi sau 'with': come up with a solution, a plan, an idea.","collocations":["come up with an idea","come up with a solution","come up with a plan","come up with a method"],"vietlish":"Đừng bỏ 'with': 'come up a solution' là sai. Phải nói 'come up with a solution'.","examples":[{"text":"Students were asked to come up with a hypothesis and then test it.","vi":"Sinh viên được yêu cầu nghĩ ra một giả thuyết rồi kiểm tra nó.","context":"academic"},{"text":"Design-Expert helped us come up with a robust set of chromatographic conditions.","vi":"Design-Expert giúp chúng tôi đề ra một bộ điều kiện sắc ký có độ vững cao (robust).","context":"rd"},{"text":"Can you come up with a plan to reduce the review time by next week?","vi":"Bạn có thể đề xuất một kế hoạch để rút ngắn thời gian xem xét trước tuần sau không?","context":"professional"}]},{"word":"save time","pos":"phrase (verb)","ipa":"/seɪv ˈtaɪm/","meaning_vi":"tiết kiệm thời gian","meaning_en":"to use less time to do something","native_logic":"Người bản xứ coi thời gian như tiền: có thể 'save' (để dành) hoặc 'waste' (lãng phí). Sau save time thường có 'by + V-ing' hoặc 'for + người': save time by automating, save time for the team.","collocations":["save time and effort","save time by automating","save a lot of time","save time for the team"],"vietlish":"Không nói 'economize time' hay 'save the time' (nghĩa chung). Nói 'save time'.","examples":[{"text":"Automated data processing can save time and reduce human error in large studies.","vi":"Xử lý dữ liệu tự động có thể tiết kiệm thời gian và giảm sai sót của con người trong các nghiên cứu lớn.","context":"academic"},{"text":"A shorter run time can save time in routine testing, but we must check the resolution first.","vi":"Thời gian chạy ngắn hơn có thể tiết kiệm thời gian khi kiểm nghiệm thường quy, nhưng trước hết phải kiểm tra độ phân giải.","context":"rd"},{"text":"I use Python to automate our reports, and this saves time for the whole team.","vi":"Tôi dùng Python để tự động hóa các báo cáo, và điều này giúp cả nhóm tiết kiệm thời gian.","context":"professional"}]}],"word_forks":[{"center":"method","groups":[{"label":"Động từ + method","items":["develop a method","validate a method","transfer a method","optimize a method"]},{"label":"Tính từ + method","items":["analytical method","robust method","stability-indicating method"]},{"label":"method + danh từ","items":["method validation","method transfer","method development"]}]},{"center":"experience","groups":[{"label":"Tính từ + experience","items":["hands-on experience","relevant experience","practical experience"]},{"label":"Số lượng và giới từ","items":["years of experience","experience in HPLC","experience with Design-Expert"]},{"label":"Động từ + experience","items":["have experience","gain experience","share your experience"]}]},{"center":"responsible","groups":[{"label":"be responsible + giới từ","items":["be responsible for the project","be responsible for writing reports","be responsible to the Department Head"]},{"label":"Trạng từ + responsible","items":["fully responsible","directly responsible","primarily responsible"]},{"label":"Danh từ responsibility","items":["take responsibility for","share responsibility","a heavy responsibility"]}]}],"word_family":[{"noun":"analysis / analyst","verb":"analyze","adjective":"analytical","adverb":"analytically"},{"noun":"validation / validity","verb":"validate","adjective":"valid / validated","adverb":"validly"},{"noun":"responsibility","verb":"—","adjective":"responsible","adverb":"responsibly"},{"noun":"compliance","verb":"comply","adjective":"compliant","adverb":"—"},{"noun":"experience","verb":"experience","adjective":"experienced","adverb":"—"}],"vietlish_trap":[{"wrong":"I have 6 years experiences.","right":"I have 6 years of experience.","why":"Cần 'of' sau years (years of experience), và experience là danh từ không đếm được nên không thêm -s."},{"wrong":"I am responsible about method validation.","right":"I am responsible for method validation.","why":"Tính từ responsible đi với giới từ 'for', không đi với 'about'. Tiếng Việt 'chịu trách nhiệm về' dễ làm bạn dịch thành 'about'."},{"wrong":"I work in ABC Pharma company.","right":"I work at ABC Pharma.","why":"Trước tên riêng của công ty (ví dụ ABC Pharma), người bản xứ dùng 'at' hoặc 'for' (work at/for ABC Pharma), không dùng 'in'. Thêm 'company' sau tên riêng là thừa và nghe không tự nhiên."},{"wrong":"I graduated Hanoi University of Pharmacy.","right":"I graduated from Hanoi University of Pharmacy.","why":"Động từ graduate cần giới từ 'from' trước tên trường. Tiếng Việt 'tốt nghiệp trường' không có giới từ nên dễ bỏ sót."},{"wrong":"We discuss about the results every week.","right":"We discuss the results every week.","why":"Discuss là ngoại động từ, đi thẳng với tân ngữ, không cần 'about'. Ngược lại 'have a discussion about' mới cần 'about'."}],"exercises":[{"type":"mcq","prompt":"I ___ the Department Head, and I give regular updates on our projects.","options":["report","report for","report to","reporting"],"answer":2,"explain":"Cụm đúng là 'report to' + người là cấp trên (báo cáo cho ai). 'report' thiếu giới từ, 'report for' sai giới từ, 'reporting' sai dạng động từ sau chủ ngữ I."},{"type":"mcq","prompt":"Chọn câu nói đúng về kinh nghiệm làm việc của Sơn:","options":["I have six years of experience.","I have six years experiences.","I have six year of experience.","I am having six years of experience."],"answer":0,"explain":"Cấu trúc đúng: number + years of experience, và experience không đếm được nên không thêm -s. Câu 2 thiếu 'of' và thêm -s, câu 3 dùng 'year' số ít sau six, câu 4 dùng thì tiếp diễn không tự nhiên cho 'have' chỉ sở hữu."},{"type":"chip_select","prompt":"I graduated ___ Hanoi University of Pharmacy, and I am responsible ___ method validation.","chips":["from","for","at","about","of","in"],"answers":["from","for"],"explain":"Graduate đi với 'from' trước tên trường (graduate from Hanoi University of Pharmacy); 'graduate in' dùng trước ngành học hoặc thời gian (graduate in pharmacy, graduate in June), không dùng trước tên trường. Responsible đi với 'for'; 'about' và 'of' là lỗi Vietlish thường gặp sau responsible, còn 'at' không đúng ở cả hai chỗ."},{"type":"chip_select","prompt":"Design-Expert helps us come ___ ___ a robust set of chromatographic conditions.","chips":["up","with","down","for","on"],"answers":["up","with"],"explain":"'come up with' là phrasal verb nghĩa là nghĩ ra, đề ra (giải pháp, ý tưởng). 'come down with' nghĩa là bị (ốm); 'come on', 'come for' không hợp nghĩa ở đây."},{"type":"error_spot","segments":[{"text":"I"},{"label":"A","text":"work"},{"label":"B","text":"in"},{"label":"C","text":"ABC Pharma, a pharmaceutical company"},{"label":"D","text":"in Vietnam."}],"answer":"B","correction":"I work at ABC Pharma, a pharmaceutical company in Vietnam.","explain":"Trước tên riêng của công ty dùng 'at' (hoặc 'for'), không dùng 'in'. 'work' đúng, phần mô tả công ty và 'in Vietnam' đều đúng."},{"type":"error_spot","segments":[{"text":"We"},{"label":"A","text":"discuss"},{"label":"B","text":"about"},{"label":"C","text":"the results"},{"label":"D","text":"every week."}],"answer":"B","correction":"We discuss the results every week.","explain":"Discuss là ngoại động từ, đi thẳng với tân ngữ nên không cần 'about'. Các phần còn lại đúng."},{"type":"register_upgrade","prompt":"Chọn cách nói trang trọng, phù hợp phỏng vấn, thay cho: 'I look after Group 1 and I check that our methods follow the rules.'","options":["Group 1 is my thing, and I check the rules stuff for the methods, you know.","I am in charge of Group 1 and make sure our methods comply with the guidelines.","I just look after Group 1 and I try to check whether our methods are kind of OK with all the rules.","I am the boss of Group 1 and I tell everyone to follow the rules for methods."],"answer":1,"explain":"Câu đúng dùng be in charge of, make sure và comply with: ngắn gọn, chính xác, đúng văn phong phỏng vấn. Các câu còn lại quá suồng sã, mơ hồ ('kind of', 'stuff', 'you know') hoặc nghe như ra lệnh ('the boss')."},{"type":"word_formation","prompt":"Our laboratory must remain ___ with EU-GMP requirements.","base":"comply","pos":"tính từ","options":["comply","compliance","complied","compliant"],"answer":3,"explain":"Sau 'remain' cần tính từ: compliant (tuân thủ) + with. 'compliance' là danh từ, 'comply' là động từ nguyên mẫu, 'complied' là dạng quá khứ nên không đúng chỗ này."}],"writing_drills":[{"prompt":"Lắp thành câu giới thiệu vai trò của bạn trong phòng AD:","tiles":["I","lead","a team of","four analysts","in the AD department."],"correct_order":["I","lead","a team of","four analysts","in the AD department."],"explain":"Chủ ngữ I + động từ lead + a team of + số người và danh từ chỉ người, rồi mới đến nơi làm việc."},{"prompt":"Lắp thành câu mô tả công việc chính:","tiles":["I","develop and validate","HPLC methods","for","related substances."],"correct_order":["I","develop and validate","HPLC methods","for","related substances."],"explain":"Hai động từ develop and validate dùng chung tân ngữ HPLC methods; 'for related substances' nói rõ mục đích của phương pháp."},{"prompt":"Lắp thành câu nói về làm việc nhóm:","tiles":["I","work closely with","my team","to make sure","our results","are reliable."],"correct_order":["I","work closely with","my team","to make sure","our results","are reliable."],"explain":"Work closely with + người, rồi mục đích 'to make sure' + mệnh đề (our results are reliable)."}]}]}</script>

function h(tag, attrs, kids){
  /* chốt chặn (bản 3.1): gọi h(tag, [con…]) hoặc h(tag, 'chữ') thì coi đó là phần con, không đặt thành thuộc tính */
  if(Array.isArray(attrs) || typeof attrs==='string' || (attrs && attrs.nodeType)){ kids = kids===undefined ? attrs : [attrs].concat(kids); attrs=null; }
  var el=document.createElement(tag);
  if(attrs){ for(var k in attrs){ if(!Object.prototype.hasOwnProperty.call(attrs,k)) continue; var v=attrs[k];
    if(v===null||v===undefined||v===false) continue;
    if(k==='class') el.className=v; else if(k==='text') el.textContent=v;
    else if(k.slice(0,2)==='on' && typeof v==='function') el.addEventListener(k.slice(2),v);
    else el.setAttribute(k, v===true?'':v); } }
  (function add(k){
    if(k===undefined||k===null||k===false||k==='') return;
    if(Array.isArray(k)){ k.forEach(add); return; }
    el.appendChild(typeof k==='string'||typeof k==='number'?document.createTextNode(String(k)):k);
  })(kids);
  return el;
}

function norm(s){ return String(s).replace(/\s+/g,' ').trim().toLowerCase(); }

  var s=document.createElementNS(SVGNS,'svg'); var z=String(size||18);

/* ---------- giọng đọc UK / US / IN (assets/js/voice.js) ---------- */
/* ---- voice.js ---- */
/* voice.js — mô-đun giọng đọc UK / US / IN dùng chung (app học tiếng Anh + Góc tự học tiếng Anh).
   Bản 23/11/2026 (bản 2), người dùng chốt: ưu tiên giọng US tốt theo từng loại máy, bỏ giọng robot,
   có nút chọn giọng và hiện tên giọng đang dùng.
   Giữ từ bản 1: nạp danh sách giọng qua voiceschanged + thử lại (whenReady), loại giọng tiếng Việt,
   pitch = 1, tốc độ theo tham số (mặc định 1,0×), thiếu giọng thì available() = false để trang ẩn nút.
   Đổi so với bản 1: giọng robot (SAPI5 "… Desktop", eSpeak, MacinTalk kiểu Fred/Albert/Zarvox, Eloquence kiểu
   Eddy/Grandma…) bị bỏ hẳn, không còn dùng làm phương án cuối; xếp giọng theo nhóm chất lượng biết trước của
   từng loại máy (Edge: Microsoft … Online (Natural); Chrome: Google US/UK English; iPhone/iPad/Mac: giọng
   Cao cấp/Nâng cao, Samantha…; Android: giọng Google tiếng Anh); người học tự chọn được giọng, lưu trên máy.
   API: Voice.supported, Voice.LABEL, Voice.NAME, Voice.ORDER (['US','UK','IN']),
        Voice.speak(text, acc, rate) → Promise, Voice.whenReady() → Promise, Voice.available(acc), Voice.isReady(),
        Voice.onChange(fn), Voice.onUse(fn(acc, voice)), Voice.stop(),
        Voice.list(acc) → [{id,name,short,lang,good,local}], Voice.current(acc) → mục như trên | null,
        Voice.chosen(acc) → true nếu người học tự chọn, Voice.choose(acc, id|null), Voice.robots(acc) → số giọng robot đã bỏ,
        Voice.preferred() → giọng ưu tiên (US nếu có), Voice.lastAcc(), Voice.device(), Voice.hint(),
        Voice.openPicker({opener}), Voice.closePicker().   acc ∈ 'UK' | 'US' | 'IN'.
   Khung HTML chèn file này tại chỗ đánh dấu bằng kh_common.inject_js. Cú pháp chạy được trên iOS Safari 14. */
var Voice=(function(){
  var supported=('speechSynthesis' in window)&&!!window.speechSynthesis&&(typeof window.SpeechSynthesisUtterance!=='undefined');
  var ACC={UK:'en-gb',US:'en-us',IN:'en-in'};
  var LABEL={UK:'🇬🇧 UK',US:'🇺🇸 US',IN:'🇮🇳 IN'};
  var NAME={US:'Giọng Mỹ (US)',UK:'Giọng Anh (UK)',IN:'Giọng Ấn Độ (IN)'};
  var ORDER=['US','UK','IN'];
  var SAMPLE='This is how this voice sounds.';
  var voices=[], ready=false, readyPromise=null, listeners=[], useListeners=[], mem={}, last=null;

  /* ---------- loại máy ---------- */
  var DEVICE=(function(){
    var ua=String((window.navigator&&navigator.userAgent)||''), tp=(window.navigator&&navigator.maxTouchPoints)||0;
    if(/iPhone|iPad|iPod/i.test(ua) || (/Macintosh/i.test(ua) && tp>1)) return 'ios';
    if(/Android/i.test(ua)) return 'android';
    if(/CrOS/i.test(ua)) return 'chromeos';
    if(/Windows/i.test(ua)) return 'windows';
    if(/Macintosh|Mac OS X/i.test(ua)) return 'mac';
    if(/Linux/i.test(ua)) return 'linux';
    return 'khac';
  })();
  var BROWSER=(function(){
    var ua=String((window.navigator&&navigator.userAgent)||'');
    if(/Edg\//.test(ua)) return 'Edge';
    if(/CriOS|Chrome\//.test(ua)) return 'Chrome';
    if(/FxiOS|Firefox\//.test(ua)) return 'Firefox';
    if(/Safari\//.test(ua)) return 'Safari';
    return '';
  })();
  var DEVICE_NAME={ios:'iPhone/iPad',android:'Android',chromeos:'Chromebook',windows:'Windows',mac:'Mac',linux:'Linux',khac:'máy này'};

  /* ---------- nhận diện giọng ---------- */
  function baseName(v){ return String(v.name||'').replace(/\s*\(.*$/,'').replace(/\s+-\s+.*$/,'').trim(); }
  function isVi(v){ return /^vi/i.test(v.lang||'') || /vietnam|tiếng việt/i.test(v.name||''); }
  /* giọng robot: tổng hợp đời cũ hoặc giọng vui của Apple — bỏ hẳn */
  var ROBOT_NAMES=/^(albert|bad news|bahh|bells|boing|bubbles|cellos|good news|jester|organ|pipe organ|superstar|trinoids|whisper|wobble|zarvox|fred|junior|kathy|ralph|princess|deranged|hysterical|bruce|agnes|vicki|victoria|eddy|flo|grandma|grandpa|reed|rocko|sandy|shelley)$/i;
  function isRobot(v){
    var n=String(v.name||''), u=String(v.voiceURI||'');
    if(/SAPI|\bDesktop\b/i.test(n+' '+u)) return true;                 /* Microsoft … Desktop (SAPI5) */
    if(/e-?speak|mbrola|festival|\bflite\b|\bpico\b|svox/i.test(n+' '+u)) return true;
    if(/^Microsoft (Sam|Mike|Mary|Anna)\b/i.test(n)) return true;      /* giọng Windows XP/Vista */
    if(/com\.apple\.eloquence/i.test(u)) return true;                   /* Eloquence trên iPhone/Mac */
    return ROBOT_NAMES.test(baseName(v));
  }
  var APPLE_GOOD=/^(samantha|alex|ava|allison|susan|tom|zoe|evan|nathan|joelle|noelle|nicky|aaron|daniel|kate|serena|stephanie|jamie|oliver|arthur|martha|rishi|veena|isha|sangeeta)$/i;
  /* nhóm chất lượng (≥ 600 = tốt, dưới = thường); mỗi họ giọng chỉ có trên một số loại máy */
  function tier(v){
    var n=String(v.name||''), u=String(v.voiceURI||''), b=baseName(v);
    if(/\(Premium\)/i.test(n) || /\.premium\./i.test(u)) return 900;            /* Apple Cao cấp */
    if(/^Microsoft .*Online \(Natural\)/i.test(n)) return 880;                   /* Edge, mọi máy */
    if(/\(Natural\)|Neural/i.test(n)) return 860;                                /* Windows 11 Natural */
    if(/\(Enhanced\)/i.test(n) || /\.enhanced\./i.test(u)) return 850;          /* Apple Nâng cao */
    if(/^Google /i.test(n)) return 800;                                          /* Chrome (cần mạng) */
    if(DEVICE==='android') return /network/i.test(n+' '+u) ? 800 : 700;         /* Google TTS trên Android */
    if(APPLE_GOOD.test(b) && !/^(Microsoft|Google)\b/i.test(n)) return 700;      /* Apple thường: Samantha, Daniel… */
    if(/^Chrome OS /i.test(n)) return 700;
    if(/^Microsoft /i.test(n)) return 300;                                       /* Windows David/Zira/Heera… */
    return 200;
  }
  var FAV={US:/^(Microsoft (Ava|Andrew|Emma|Brian|Aria|Jenny)\b|Ava\b|Zoe\b|Samantha\b|Google US English)/i,
           UK:/^(Microsoft (Sonia|Ryan|Libby)\b|Daniel\b|Serena\b|Kate\b|Jamie\b|Google UK English Female)/i,
           IN:/^(Microsoft (Neerja|Prabhat)\b|Isha\b|Rishi\b|Veena\b)/i};
  function score(v,acc){ return tier(v)+(FAV[acc]&&FAV[acc].test(v.name||'')?10:0)+(v.localService?3:0)+(v['default']?1:0); }
  function idOf(v){ return String(v.voiceURI||v.name||''); }
  function shortName(v){
    var n=String(v.name||'').replace(/\s+-\s+(English|Tiếng Anh).*$/i,'').replace(/^Microsoft\s+/i,'')
      .replace(/\s+Online\s+\(Natural\)/i,' (Natural)').replace(/\s*\((English|Tiếng Anh)\s*\([^)]*\)\)\s*$/i,'');
    n=n.replace(/\s+/g,' ').trim();
    return n || String(v.name||'') || 'giọng không tên';
  }
  function langOf(v){ return String(v.lang||'').replace('_','-').toLowerCase(); }
  function load(){ if(!supported) return; try{ voices=(window.speechSynthesis.getVoices()||[]).filter(function(v){ return !isVi(v); }); }catch(e){ voices=[]; } }
  function candidates(acc){
    var want=ACC[acc]; if(!want) return [];
    var c=voices.filter(function(v){ return langOf(v)===want && !isRobot(v); });
    c.sort(function(a,b){ return score(b,acc)-score(a,acc); });

  }

function shadowBtn(text, accFn){

var META=SPEC.meta||{};

var state={ unit:'overview', sub:'vocab' };
var results=store.get('results',{});   /* uid -> true/false */
function setResult(key,ok){ results[key]=!!ok; store.set('results',results); progressChanged(); }
function unitScore(u){
  var n=(u.exercises||[]).length, ok=0;
  for(var i=0;i<n;i++){ if(results[u.id+':ex:'+i]===true) ok++; }
  return {ok:ok,total:n};
}
function drillScore(u){
  var n=(u.writing_drills||[]).length, ok=0;
  for(var i=0;i<n;i++){ if(results[u.id+':drill:'+i]===true) ok++; }
  return {ok:ok,total:n};
}
function knownCount(u){
  var known=store.get('flash',{}), items=u.vocab_items||[], n=0;
  for(var i=0;i<items.length;i++){ if(known[u.id+':'+i]) n++; }
  return {ok:n,total:items.length};
}
/* tổng tiến độ = số bài (trắc nghiệm + lắp ghép câu) đã làm đúng trên tổng số bài */
function totals(){
  var t={done:0,total:0,known:0,words:0};
  units.forEach(function(u){ var a=unitScore(u), d=drillScore(u), k=knownCount(u);
    t.done+=a.ok+d.ok; t.total+=a.total+d.total; t.known+=k.ok; t.words+=k.total; });
  return t;
}
/* tóm tắt cho trang Góc tự học tiếng Anh: localStorage ecb:hub:<appId> = {title, done, total, last} */
function hubWrite(){
  try{
    if(!store.persistent() || !META.id) return;
    var t=totals();
    window.localStorage.setItem('ecb:hub:'+META.id, JSON.stringify({title:META.title||'', done:t.done, total:t.total, last:new Date().toISOString()}));
  }catch(e){}
}
function updateHeader(){
  var t=totals();
  document.getElementById('h-sub').textContent='Đúng '+t.done+'/'+t.total+' bài · đã thuộc '+t.known+'/'+t.words+' từ';
  document.getElementById('h-bar').style.width=(t.total?Math.round(100*t.done/t.total):0)+'%';
}
function progressChanged(){ updateHeader(); hubWrite(); }
function pct(s){ return s.total?Math.round(100*s.ok/s.total):0; }

/* nhãn Unit: số (Unit 3), mã ngắn (Unit 12A) hoặc tên bài (Effortless English) */
function unitPrefix(u){
  if(u.label!==undefined && u.label!==null && String(u.label).trim()!=='') return String(u.label).trim();
  var n=u.number;
  if(typeof n==='number') return 'Unit '+n;
  n=String(n===undefined||n===null?'':n).trim();
  if(/^\d+[A-Za-z]?$/.test(n)) return 'Unit '+n;
  return n;
}
function unitName(u){ var p=unitPrefix(u); return p ? p+': '+u.title : u.title; }

var SUBS=[['vocab','Từ vựng','Từ vựng','book'],['flash','Thẻ nhớ','Flashcards','cards'],['forks','Ghép từ','Sơ đồ & họ từ','fork'],
  ['vietlish','Vietlish','Bẫy Vietlish','warn'],['practice','Bài tập','Bài tập & viết câu','task']];
/* Unit có câu chuyện (Effortless English): mục đầu là Câu chuyện; Ghép từ và Vietlish gộp một mục để thanh dưới vẫn 5 nút */
var SUBS_STORY=[['story','Câu chuyện','Câu chuyện','headphones'],['vocab','Từ vựng','Từ vựng','book'],['flash','Thẻ nhớ','Flashcards','cards'],
  ['forks','Ghép từ','Ghép từ & Vietlish','fork'],['practice','Bài tập','Bài tập & viết câu','task']];
function hasStory(u){ return !!(u && u.story && typeof u.story==='object'); }
function subsOf(u){ return hasStory(u)?SUBS_STORY:SUBS; }
function firstSub(u){ return hasStory(u)?'story':'vocab'; }
function unitById(id){ return units.filter(function(x){ return x.id===id; })[0]||null; }
function go(unit, sub){ state.unit=unit; state.sub=sub||firstSub(unitById(unit)); render(); window.scrollTo(0,0); }
function renderNav(){
  var nav=document.getElementById('nav-units'); clear(nav); var cur=null;
  function tab(id,label){ var b=h('button',{type:'button','aria-current':state.unit===id?'true':'false',text:label,onclick:function(){ go(id,firstSub(unitById(id))); }}); if(state.unit===id) cur=b; nav.appendChild(b); }
  tab('overview','Tổng quan');
  if(SPEC.user_pdf_review) tab('review','Góc sửa bài');
  units.forEach(function(u){ tab(u.id,unitName(u)); });
  if(cur && nav.scrollWidth>nav.clientWidth){ nav.scrollLeft=Math.max(0, cur.offsetLeft-(nav.clientWidth-cur.offsetWidth)/2); }
}
function renderSubNav(u){
  var nav=document.getElementById('nav-sub'); clear(nav);
  nav.classList.toggle('hide', !u);
  if(!u) return;
  var merged=hasStory(u);
  subsOf(u).forEach(function(s){
    var on = s[0]==='practice' ? (state.sub==='exercises'||state.sub==='drills') : (merged && s[0]==='forks' ? (state.sub==='forks'||state.sub==='vietlish') : state.sub===s[0]);
    nav.appendChild(h('button',{type:'button','data-sub':s[0],'aria-current':on?'true':'false','aria-label':s[2],
      onclick:function(){ state.sub = s[0]==='practice' ? (state.sub==='drills'?'drills':'exercises') : s[0]; render(); window.scrollTo(0,0); }},
      [ icon(s[3],20), h('span',{class:'s-short',text:s[1]}), h('span',{class:'s-long',text:s[2]}) ]));
  });
}
function render(){
  stopPlay();   /* đổi trang: dừng câu chuyện đang đọc */
  audioBtns=[]; storyAccBtns=[];
  var u=null;
  if(state.unit!=='overview' && state.unit!=='review'){ u=unitById(state.unit); if(!u) state.unit='overview'; }
  if(state.unit==='review' && !SPEC.user_pdf_review) state.unit='overview';
  if(u){ if(state.sub==='story' && !hasStory(u)) state.sub='vocab'; if(state.sub==='vietlish' && hasStory(u)) state.sub='forks'; }
  renderNav(); renderSubNav(u);
  var view=document.getElementById('view'); clear(view); view.appendChild(voiceNotice);
  try{
    if(state.unit==='overview') renderOverview(view);
    else if(state.unit==='review') renderReview(view);
    else renderUnit(view,u);
  }catch(e){ view.appendChild(h('div',{class:'card fb bad',text:'Không dựng được trang này: '+e.message})); }
  refreshAudio(); updateHeader();
  store.set('pos',{unit:state.unit,sub:state.sub});
}

/* ---------- liên kết Drive ---------- */

/* ---------- Tổng quan ---------- */

  var route=h('div',{class:'route'});
  units.forEach(function(u){
    var sc=unitScore(u), p=pct(sc);
    var nv=(u.vocab_items||[]).length;
    route.appendChild(h('div',{class:'route-item'},[
      h('div',{},[ h('div',{class:'rt',text:unitName(u)}), h('div',{class:'muted small',text:(hasStory(u)?'Câu chuyện '+u.story.main.length+' câu · mini-story '+u.story.mini.length+' câu hỏi · ':'')+nv+' từ · '+sc.total+' bài tập · đúng '+sc.ok+'/'+sc.total}),
        u.goal? h('div',{class:'muted small',text:u.goal}):null ]),

      h('div',{class:'bar','aria-hidden':'true'},h('i',{style:'width:'+p+'%'}))
    ]));

  view.appendChild(h('div',{class:'notice small',text: store.persistent()? 'Tiến độ được lưu trên trình duyệt này.' : 'Trình duyệt đang chặn lưu trữ cục bộ (thường gặp khi nhúng trong Google Sites): tiến độ chỉ giữ đến khi đóng trang.'}));
  /* xoá tiến độ: bấm 2 lần để tránh lỡ tay (không dùng hộp thoại) */

    if(!armed){ reset.textContent='Bấm lần nữa để xóa hẳn'; reset.classList.add('shd'); armed=setTimeout(function(){ armed=null; reset.textContent='Xóa tiến độ'; reset.classList.remove('shd'); },5000); return; }
    clearTimeout(armed); armed=null; results={}; store.set('results',results); store.set('flash',{}); store.set('story_days',{}); store.set('story_ok',{}); store.set('mini_pos',{}); progressChanged(); render(); }});

/* ---------- Góc sửa bài ---------- */
function renderReview(view){
  var r=SPEC.user_pdf_review||{};
  var c=h('div',{class:'card'}); c.appendChild(h('div',{class:'eyebrow',text:'Chữa bài trên PDF của bạn'})); c.appendChild(h('h2',{class:'sec',text:'Góc sửa bài cá nhân hóa'}));
  if(r.summary) c.appendChild(h('p',{text:r.summary}));
  view.appendChild(c);
  function block(title,ic,cls,cols,rows){
    if(!rows||!rows.length) return;
    var card=h('div',{class:'card'}); card.appendChild(h('h3',{class:'rv-h '+cls},[ icon(ic,20), title+' ('+rows.length+')' ]));
    var list=h('div',{class:'rv-list'});
    rows.forEach(function(row){
      var dl=h('dl'); cols.forEach(function(x){ dl.appendChild(h('dt',{text:x[1]})); dl.appendChild(h('dd',{text:row[x[0]]||''})); });
      list.appendChild(h('div',{class:'rv'},dl));
    });
    card.appendChild(list); view.appendChild(card);
  }
  block('Đã làm đúng','check','okc',[['item','Câu/Bài'],['comment','Nhận xét']],r.correct);
  block('Cần sửa','x','badc',[['item','Câu/Bài'],['your_answer','Bạn đã điền'],['correct','Đáp án đúng'],['why','Vì sao']],r.to_fix);
  block('Không đọc rõ','help','unk',[['item','Câu/Bài'],['note','Ghi chú']],r.unreadable);
}

/* ---------- Unit ---------- */
function renderUnit(view,u){
  var head=h('div',{class:'unit-head'});
  var pre=unitPrefix(u);
  if(pre) head.appendChild(h('div',{class:'eyebrow',text:pre}));
  head.appendChild(h('h2',{class:'sec',text:u.title}));
  if(u.goal && state.sub===firstSub(u)) head.appendChild(h('p',{class:'muted',style:'margin:0',text:u.goal}));   /* mục tiêu chỉ ở mục đầu, đỡ chiếm chỗ trên điện thoại */
  var al=audioLinks(); if(al) head.appendChild(al);
  view.appendChild(head);
  var grid=h('div',{class:'unit-grid'}), box=h('div',{class:'unit-main'});
  grid.appendChild(box); grid.appendChild(unitAside(u)); view.appendChild(grid);
  ({story:renderStory,vocab:renderVocab,flash:renderFlash,forks:hasStory(u)?renderForksTraps:renderForks,vietlish:renderVietlish,exercises:renderExercises,drills:renderDrills})[state.sub](box,u);
}
var asideRefs=null;
function unitAside(u){
  var a=unitScore(u), d=drillScore(u), k=knownCount(u);
  function line(lbl,s){ var bar=h('div',{class:'bar','aria-hidden':'true'},h('i',{style:'width:'+pct(s)+'%'})); var val=h('span',{text:s.ok+' / '+s.total});
    return {el:[ h('div',{class:'prog-row'},[ h('span',{text:lbl}), val ]), bar ], val:val, bar:bar}; }
  var l1=line('Bài tập đúng',a), l2=line('Câu lắp ghép đúng',d), l3=line('Từ đã thuộc',k), l4=hasStory(u)?line('Ngày đã nghe câu chuyện',dayScore(u)):null;
  asideRefs={u:u,l1:l1,l2:l2,l3:l3,l4:l4};
  return h('aside',{class:'card aside-card','aria-label':'Tiến độ Unit'},[ h('h3',{text:'Tiến độ Unit'}), l4?l4.el:null, l1.el, l2.el, l3.el,
    h('div',{class:'muted small',text: store.persistent()?'Tiến độ lưu trên thiết bị này.':'Tiến độ chỉ giữ đến khi đóng trang.'}) ]);
}
function refreshAside(){
  if(!asideRefs || !document.body.contains(asideRefs.l1.val)) return;
  var u=asideRefs.u, L=[[asideRefs.l1,unitScore(u)],[asideRefs.l2,drillScore(u)],[asideRefs.l3,knownCount(u)]];
  if(asideRefs.l4) L.push([asideRefs.l4,dayScore(u)]);
  L.forEach(function(p){
    p[0].val.textContent=p[1].ok+' / '+p[1].total; p[0].bar.firstChild.style.width=pct(p[1])+'%'; });
}

function renderVocab(box,u){
  var q=h('input',{type:'search',placeholder:'Tìm từ…','aria-label':'Tìm từ trong Unit'});
  var list=h('div');
  function draw(){
    clear(list); audioBtns=audioBtns.filter(function(b){ return document.body.contains(b)&&!list.contains(b); });
    var term=norm(q.value);
    (u.vocab_items||[]).forEach(function(v,i){ if(!term || norm([v.word,v.meaning_vi,v.meaning_en].join(' ')).indexOf(term)>=0) list.appendChild(vocabCard(v,u,i)); });
    if(!list.firstChild) list.appendChild(h('p',{class:'muted',text:'Không có từ nào khớp.'}));
    refreshAudio();
  }
  q.addEventListener('input',draw);
  box.appendChild(q); box.appendChild(list); draw();
}
var CTX={academic:'Học thuật',rd:'Nghiên cứu & kiểm nghiệm',professional:'Báo cáo & giao tiếp'};
function knownToggle(u,i,word){
  var key=u.id+':'+i;
  var b=h('button',{type:'button',class:'btn'});
  function paint(){ var on=!!store.get('flash',{})[key]; clear(b); b.appendChild(icon('check',18)); b.appendChild(document.createTextNode(on?'Đã thuộc':'Đánh dấu đã thuộc'));
    b.classList.toggle('tint',on); b.setAttribute('aria-pressed',on?'true':'false'); b.setAttribute('aria-label',(on?'Bỏ đánh dấu đã thuộc: ':'Đánh dấu đã thuộc: ')+word); }
  b.addEventListener('click',function(){ var known=store.get('flash',{}); known[key]=!known[key]; store.set('flash',known); paint(); progressChanged(); refreshAside(); });
  paint(); return b;
}
function vocabCard(v,u,i){
  var c=h('article',{class:'card'});
  c.appendChild(h('div',{class:'v-top'},[
    h('div',{},[ v.pos?h('div',{class:'eyebrow',text:v.pos}):null, h('h3',{class:'word',text:v.word}), v.ipa?h('div',{class:'ipa',text:v.ipa}):null ]),
    knownToggle(u,i,v.word) ]));
  c.appendChild(h('div',{class:'say',role:'group','aria-label':'Nghe từ '+v.word},[ speakBtn('UK','Từ',v.word,'tint'), speakBtn('US','Từ',v.word,'tint'), speakBtn('IN','Từ',v.word,'tint') ]));
  c.appendChild(h('p',{class:'meaning'},[ h('strong',{text:v.meaning_vi||''}), v.meaning_en? h('span',{class:'muted',text:' — '+v.meaning_en}):null ]));
  if(v.native_logic) c.appendChild(h('p',{class:'small'},[ h('strong',{text:'Tư duy bản xứ: '}), v.native_logic ]));

  c.appendChild(h('div',{class:'divider'}));

    var d=h('div',{class:'ex'});
    if(e.context) d.appendChild(h('span',{class:'ctx '+e.context,text:CTX[e.context]||e.context}));

    d.appendChild(h('div',{class:'ex-btns'},[ speakBtn('UK','Câu',e.text), speakBtn('US','Câu',e.text), speakBtn('IN','Câu',e.text), shadowBtn(e.text) ]));
    c.appendChild(d);
  });
  if(v.vietlish) c.appendChild(h('div',{class:'fb bad small trapnote'},[ h('strong',{text:'Bẫy Vietlish: '}), v.vietlish ]));
  return c;

/* ---------- Câu chuyện kiểu Effortless English (bản 3): câu chuyện chính, mini-story hỏi–đáp, point of view ---------- */
/* Mỗi lần bấm Nghe/Bắt đầu tạo một "lượt" mới; đổi trang hoặc bấm Dừng thì lượt cũ tự dừng (play.tok đổi). */
var play={tok:0}, storyAccBtns=[];
function stopPlay(){ play.tok++; try{ Voice.stop(); }catch(e){} }
function wait(ms){ return new Promise(function(r){ setTimeout(r,ms); }); }
function storyAcc(){ var a=store.get('story_acc',null); if(a && Voice.available(a)) return a; return Voice.preferred(); }
function storyHide(){ return store.get('story_hide',false)===true; }
function storyNoVi(){ return store.get('story_novi',false)===true; }
function dayCount(u){ var n=u.story&&u.story.days; return (typeof n==='number' && n>=7 && n<=14)?n:7; }
function dayScore(u){ var n=dayCount(u), a=(store.get('story_days',{})[u.id])||[], ok=0; for(var i=0;i<n;i++){ if(a[i]===true) ok++; } return {ok:ok,total:n}; }
function paintStoryAcc(){
  var cur=storyAcc();
  storyAccBtns.forEach(function(b){ var on=b.getAttribute('data-acc')===cur; b.classList.toggle('primary',on); b.setAttribute('aria-pressed',on?'true':'false'); });
}
function storyMode(){ var m=store.get('story_mode','main'); return ({main:1,mini:1,pov:1})[m]?m:'main'; }

function renderStory(box,u){
  var st=u.story, mode=storyMode();
  /* nhắc (không khoá) khi bài có câu chuyện trước đó chưa được đánh dấu "đã hiểu ngay" */
  var idx=units.indexOf(u), prev=null;
  for(var i=idx-1;i>=0;i--){ if(hasStory(units[i])){ prev=units[i]; break; } }
  if(prev && !store.get('story_ok',{})[prev.id]) box.appendChild(h('div',{class:'notice',role:'note',
    text:'Bài trước ('+unitName(prev)+') chưa được đánh dấu "Đã hiểu ngay". Effortless English khuyên nghe bài trước đến khi hiểu ngay, không cần dịch, rồi mới học bài mới.'}));
  box.appendChild(planCard(u));
  function modeBtn(id,label){ return h('button',{type:'button','data-mode':id,'aria-current':mode===id?'true':'false',text:label,onclick:function(){ store.set('story_mode',id); render(); }}); }
  box.appendChild(h('div',{class:'switch three',role:'group','aria-label':'Chọn phần của câu chuyện'},[
    modeBtn('main','Câu chuyện chính'), modeBtn('mini','Mini-story hỏi–đáp'), modeBtn('pov','Point of view') ]));
  box.appendChild(storySettings());
  if(mode==='mini') renderMini(box,u); else if(mode==='pov') renderPov(box,u); else renderMain(box,u);
}
function planCard(u){
  var st=u.story, n=dayCount(u), arr=(store.get('story_days',{})[u.id])||[], ok=!!store.get('story_ok',{})[u.id];
  var c=h('div',{class:'card','data-testid':'story-plan'});
  c.appendChild(h('h3',{text:'Lịch nghe lại '+n+' ngày'}));
  c.appendChild(h('p',{class:'small',text:st.plan_note||'Mỗi ngày nghe lại câu chuyện chính, làm mini-story và point of view, rồi đánh dấu ngày đã học.'}));
  var grid=h('div',{class:'days',role:'group','aria-label':'Đánh dấu ngày đã học'});
  for(var d=0; d<n; d++){ (function(d){ var on=arr[d]===true;
    grid.appendChild(h('button',{type:'button','aria-pressed':on?'true':'false','aria-label':'Ngày '+(d+1)+(on?': đã học, bấm để bỏ':': chưa học, bấm để đánh dấu'),text:String(d+1),
      onclick:function(){ var m=store.get('story_days',{}), a=(m[u.id]||[]).slice(); a[d]=!(a[d]===true); m[u.id]=a; store.set('story_days',m); render(); }})); })(d); }
  c.appendChild(h('p',{class:'small muted',style:'margin:8px 0 0',text:'Ngày đã học: '+dayScore(u).ok+'/'+n}));
  c.appendChild(grid);
  var okb=h('button',{type:'button',class:'btn'+(ok?' tint':''),'aria-pressed':ok?'true':'false','data-testid':'story-ok',onclick:function(){
    var m=store.get('story_ok',{}); m[u.id]=!m[u.id]; store.set('story_ok',m); render(); }},[ icon('check',18), ok?'Đã hiểu ngay, không cần dịch':'Đánh dấu: đã hiểu ngay, không cần dịch' ]);
  c.appendChild(h('div',{class:'row',style:'margin-top:12px'},okb));

function storySettings(){
