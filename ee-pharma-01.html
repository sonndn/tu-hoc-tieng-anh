  ['US','UK','IN'].forEach(function(acc){
    var b=h('button',{type:'button',class:'btn','data-acc':acc,'aria-pressed':'false','aria-label':'Đọc câu chuyện bằng giọng '+acc,text:acc,
      onclick:function(){ store.set('story_acc',acc); stopPlay(); paintStoryAcc(); }});
    audioBtns.push(b); storyAccBtns.push(b); accRow.appendChild(b); });
  var hide=storyHide(), novi=storyNoVi();
  var tRow=h('div',{class:'row'},[
    h('button',{type:'button',class:'btn'+(hide?' tint':''),'aria-pressed':hide?'true':'false','data-testid':'story-hide',onclick:function(){ store.set('story_hide',!hide); render(); }},
      hide?'Đang ẩn chữ: chỉ nghe':'Ẩn chữ tiếng Anh'),
    h('button',{type:'button',class:'btn'+(novi?' tint':''),'aria-pressed':novi?'true':'false','data-testid':'story-novi',onclick:function(){ store.set('story_novi',!novi); render(); }},
      novi?'Đang ẩn tiếng Việt':'Ẩn tiếng Việt') ]);
  c.appendChild(accRow); c.appendChild(tRow);

/* danh sách câu: bấm số để nghe một câu, mỗi câu có nút Nhại câu */
function sentenceList(sentences){
  var hide=storyHide(), novi=storyNoVi(), list=h('div',{class:'st-list'}), rows=[];
  function mark(k){ rows.forEach(function(r,i){ r.classList.toggle('on',i===k); }); }
  function unmark(){ rows.forEach(function(r){ r.classList.remove('on'); }); }
  sentences.forEach(function(s,k){
    var no=h('button',{type:'button',class:'btn no','data-acc':'ANY','aria-label':'Nghe câu '+(k+1)+(hide?'':': '+s.text),text:String(k+1),onclick:function(){
      var a=storyAcc(); if(!a) return; stopPlay(); var my=play.tok; mark(k);

var PAUSES=[3,5,8];
function renderMini(box,u){
  var items=u.story.mini, hide=storyHide(), novi=storyNoVi();

}

  arr.forEach(function(d,i){
    var key=u.id+':drill:'+i;
    var c=h('article',{class:'card','data-type':'drill'});
    c.appendChild(h('div',{class:'ex-head'},[ h('strong',{text:'Lắp ghép '+(i+1)}), results[key]===true?h('span',{class:'tag done',text:'Đã đúng'}):null ]));
    c.appendChild(h('p',{class:'prompt',text:d.prompt}));
    var answer=h('div',{class:'tilebox answer','aria-label':'Câu của bạn','data-ph':'Bấm các mảnh bên dưới theo đúng thứ tự'}), pool=h('div',{class:'tilebox','aria-label':'Các mảnh'});
    var placed=[]; var tiles=[]; var locked=false;
    var order=shuffle(d.tiles.map(function(_,k){ return k; }));
    if(d.tiles.length>1){ var tries=0; while(order.map(function(k){ return d.tiles[k]; }).join('|')===d.correct_order.join('|') && tries<10){ order=shuffle(order); tries++; } }
    order.forEach(function(k){
      var t=h('button',{type:'button',class:'tile',text:d.tiles[k],onclick:function(){ if(locked) return; if(t.parentNode===pool){ answer.appendChild(t); placed.push(t); } else { pool.appendChild(t); placed.splice(placed.indexOf(t),1); } }});
      tiles.push(t); pool.appendChild(t);
    });
    var out=h('div');
    var chk=h('button',{type:'button',class:'btn primary',text:'Kiểm tra',onclick:function(){
      var cur=placed.map(function(t){ return t.textContent; });
      if(cur.length!==d.tiles.length){ clear(out); out.appendChild(h('div',{class:'fb bad',text:'Hãy dùng hết các mảnh để lắp thành câu.'})); return; }
      var s=norm(cur.join(' ')), ok=norm(d.correct_order.join(' '))===s || (d.alt_orders||[]).some(function(a){ return norm(a.join(' '))===s; });
      locked=true; chk.disabled=true; setResult(key,ok); refreshAside(); clear(out);
      var full=d.correct_order.join(' ');
      out.appendChild(feedback(ok,(ok?'':'Câu mẫu: '+sentence(full))+(d.explain||'')));
      out.appendChild(h('div',{class:'row',style:'margin-top:10px'},[ speakBtn('UK','Câu',full), speakBtn('US','Câu',full), speakBtn('IN','Câu',full) ])); refreshAudio();
    }});
    var reset=h('button',{type:'button',class:'btn',onclick:function(){ delete results[key]; store.set('results',results); progressChanged(); render(); }},[ icon('redo',18), 'Làm lại' ]);
    c.appendChild(answer); c.appendChild(pool); c.appendChild(h('div',{class:'row'},[chk,reset])); c.appendChild(out); box.appendChild(c);
  });
}

/* ---------- khởi động ---------- */
document.getElementById('app-title').textContent=META.title||'Học tiếng Anh';
document.title=META.title||document.title;
if(META.demo===true) document.getElementById('demo').classList.remove('hide');
var theme=store.get('theme',null);
if(!theme){ try{ theme=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'; }catch(e){ theme='light'; } }
var themeBtn=document.getElementById('theme');
function paintTheme(){
  document.documentElement.setAttribute('data-theme',theme); clear(themeBtn);
  themeBtn.appendChild(icon(theme==='dark'?'sun':'moon',18));
  themeBtn.appendChild(h('span',{class:'t-lbl',text:theme==='dark'?'Chế độ sáng':'Chế độ tối'}));
}
paintTheme();
themeBtn.addEventListener('click',function(){ theme=theme==='dark'?'light':'dark'; paintTheme(); store.set('theme',theme); });
var pos=store.get('pos',null);
if(pos && typeof pos.unit==='string'){ state.unit=pos.unit; state.sub=({story:1,vocab:1,flash:1,forks:1,vietlish:1,exercises:1,drills:1})[pos.sub]?pos.sub:firstSub(unitById(pos.unit)); }
Voice.whenReady().then(refreshAudio);
render();
hubWrite();
window.__ECB_READY__=true;
})();
</script>
