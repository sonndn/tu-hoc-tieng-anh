<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<!-- Hàng rào của trình duyệt: trang chỉ được gọi tới nơi ghi điểm (Google Apps Script) và chính thư mục của nó; không tải mã, ảnh, phông chữ từ nơi khác. Địa chỉ 127.0.0.1/localhost chỉ dùng khi chạy bài kiểm tra. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' data: blob:; connect-src 'self' https://script.google.com https://script.googleusercontent.com http://127.0.0.1:* http://localhost:*; form-action 'none'; base-uri 'none'; object-src 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Effortless English · Level 1 · Bài 1: Day of the Dead</title>
<link rel="icon" href="data:,">
<style>
/* Phong cách A · Rõ ràng: nền sáng, Arimo/Arial, nút gần vuông (bo 4px), không logo STELLA, không Navy/Gold */
:root{--bg:#F4F6FA;--card:#FFFFFF;--soft:#F9FAFB;--chip:#F3F4F6;--line:#E5E7EB;--line2:#D1D5DB;--ink:#111827;--ink2:#374151;--muted:#4B5563;
--accent:#1D4ED8;--accent-ink:#FFFFFF;--accent-text:#1D4ED8;--tint:#E3EAFB;
--ok:#15803D;--okbg:#DCFCE7;--okline:#86EFAC;--oktext:#14532D;--okbox:#F0FDF4;
--bad:#B91C1C;--badbg:#FEF2F2;--badline:#FCA5A5;--badtext:#7F1D1D;
--sh:#9A3412;--shbg:#FFF7ED;--shline:#FDBA74;
--ac-bg:#DBEAFE;--ac:#1E40AF;--rd-bg:#CCFBF1;--rd:#115E59;--pr-bg:#FFEDD5;--pr:#9A3412;
--focus:#1D4ED8;color-scheme:light}
[data-theme=dark]{--bg:#0F141B;--card:#171D26;--soft:#1C2330;--chip:#232B38;--line:#2B3442;--line2:#3D4858;--ink:#E7ECF2;--ink2:#CBD3DD;--muted:#A7B2BF;
--accent:#2F62D6;--accent-ink:#FFFFFF;--accent-text:#93B6FF;--tint:#1E2B47;
--ok:#4ADE80;--okbg:#12301F;--okline:#2F7A4B;--oktext:#A7F3C0;--okbox:#10271A;
--bad:#F87171;--badbg:#3A1717;--badline:#8A3434;--badtext:#FECACA;
--sh:#FDBA74;--shbg:#3A2412;--shline:#8A5426;
--ac-bg:#1E2F57;--ac:#C7D7FF;--rd-bg:#123B38;--rd:#99F6E4;--pr-bg:#3D2614;--pr:#FDBA74;
--focus:#93B6FF;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;height:100%;scroll-padding-bottom:76px}
body{margin:0;min-height:100%;min-height:100dvh;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);
  font:16px/1.55 Arimo,Arial,"Helvetica Neue",sans-serif;overflow-wrap:break-word}
p,h1,h2,h3,h4,li,.en,.vi,.opt,.tile,.seg,.fb,.wrong,.right{overflow-wrap:anywhere}
td,th{overflow-wrap:break-word}
button,select{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}
svg{flex:none}
img,svg{max-width:100%}
a{color:var(--accent-text)}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.hide{display:none!important}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- đầu trang ---------- */
header.top{order:0;background:var(--card);border-bottom:1px solid var(--line);padding:12px max(12px,calc((100% - 1100px)/2)) 10px}
.h-grid{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"mark title title" "bar bar tools";gap:8px 12px;align-items:center}
.mark{grid-area:mark}.h-title{grid-area:title}.h-tools{grid-area:tools}.h-bar{grid-area:bar}
@media(min-width:600px){.h-grid{grid-template-areas:"mark title tools" "bar bar bar";gap:10px 16px}}
.mark{width:40px;height:40px;border-radius:4px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;flex:none;letter-spacing:-.02em}
.h-title{min-width:0}
.h-title h1{font-size:16px;line-height:1.3;margin:0;font-weight:700}
.h-sub{font-size:13px;color:var(--muted);margin-top:2px}
.h-tools{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:8px;justify-self:end;min-width:0}
@media(max-width:599px){.h-grid{grid-template-areas:"mark title title" "tools tools tools" "bar bar bar"}.h-tools{justify-self:stretch;justify-content:flex-start}}
.vbtn{flex-direction:column;align-items:flex-start;justify-content:center;gap:0;padding:3px 10px;max-width:220px;text-align:left}
.vbtn small{font-size:12px;line-height:1.2;color:var(--muted)}
.vbtn b{font-size:14px;line-height:1.25;font-weight:600;overflow-wrap:anywhere}
.h-lbl{font-size:13px;color:var(--muted)}
select{min-height:44px;font-size:16px;padding:0 8px;border:1px solid var(--line2);border-radius:4px;background:var(--card);color:var(--ink)}
.h-bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.h-bar>i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
@media(max-width:599px){.h-lbl,.t-lbl{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}}
@media(min-width:600px){.h-title h1{font-size:18px}.mark{width:44px;height:44px;font-size:18px}}

/* ---------- chọn Unit ---------- */
nav.units{order:1;background:var(--card);border-bottom:1px solid var(--line);display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;
  padding:8px max(12px,calc((100% - 1100px)/2));scrollbar-width:thin}
nav.units button{flex:none;min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:4px;background:var(--card);color:var(--ink2);font-size:14px;white-space:nowrap}
nav.units button[aria-current=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}

/* ---------- mục trong Unit: thanh dưới (điện thoại), dải trên (máy tính) ---------- */
nav.sub{order:10;position:-webkit-sticky;position:sticky;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;padding:4px 6px;padding-bottom:calc(4px + env(safe-area-inset-bottom))}
nav.sub button{min-height:52px;min-width:44px;border:0;border-radius:4px;background:transparent;color:var(--muted);font-size:12px;line-height:1.15;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:2px 0;text-align:center}
nav.sub button[aria-current=true]{color:var(--accent-text);background:var(--tint);font-weight:700}
nav.sub .s-long{display:none}
@media(max-width:300px){nav.sub button{font-size:11px}}
@media(min-width:900px){
  html{scroll-padding-bottom:0;scroll-padding-top:76px}
  nav.sub{order:2;top:0;bottom:auto;display:flex;flex-wrap:wrap;border-top:0;border-bottom:1px solid var(--line);padding:8px max(12px,calc((100% - 1100px)/2))}
  nav.sub button{flex-direction:row;gap:8px;min-height:44px;padding:0 16px;font-size:14px;color:var(--ink2);border:1px solid var(--line);background:var(--card)}
  nav.sub button[aria-current=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
  nav.sub .s-long{display:inline}nav.sub .s-short{display:none}
}
@media(max-height:500px){
  nav.sub{position:static;order:2;display:flex;flex-wrap:wrap;border-top:0;border-bottom:1px solid var(--line);padding:8px max(12px,calc((100% - 1100px)/2))}
  nav.sub button{flex-direction:row;gap:6px;min-height:44px;padding:0 12px;font-size:14px;border:1px solid var(--line);background:var(--card)}
  nav.sub button[aria-current=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  html{scroll-padding-top:0;scroll-padding-bottom:0}}

.demo{order:3;background:var(--shbg);color:var(--sh);border-bottom:1px solid var(--shline);font-size:13px;font-weight:700;letter-spacing:.04em;
  padding:6px max(12px,calc((100% - 1100px)/2))}
main{order:4;flex:1 0 auto;width:100%;max-width:1100px;margin:0 auto;padding:16px 12px 28px}
@media(min-width:600px){main{max-width:1132px;padding:20px 16px 32px}}

/* ---------- khối chung ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px;margin:0 0 12px}
@media(min-width:600px){.card{padding:20px 24px;margin-bottom:16px}}
.card p{margin:0 0 10px}
.card>:first-child{margin-top:0}.card>:last-child{margin-bottom:0}
h2,h3,h4{line-height:1.3}
.card h2{font-size:20px;margin:0 0 8px}
.card h3{font-size:17px;margin:0 0 10px}
.eyebrow{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
h2.sec{font-size:20px;margin:2px 0 6px}
@media(min-width:600px){h2.sec{font-size:22px}}
.muted{color:var(--muted)}
.small{font-size:14px}
.notice{background:var(--soft);border:1px solid var(--line);border-radius:4px;padding:10px 12px;margin:0 0 12px;font-size:14px;color:var(--ink2)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.stack{display:flex;flex-direction:column;gap:8px}
.chip{display:inline-block;background:var(--chip);color:var(--ink2);border-radius:3px;padding:4px 10px;font-size:14px;line-height:1.4}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 0}
.divider{height:1px;background:var(--line);margin:16px 0}
.btn{min-height:44px;min-width:44px;padding:0 14px;border:1px solid var(--line2);border-radius:4px;background:var(--card);color:var(--ink);
  font-size:15px;line-height:1.25;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center;text-decoration:none}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.tint{background:var(--tint);border-color:var(--tint);color:var(--accent-text);font-weight:600}
.btn.shd{background:var(--shbg);border-color:var(--shline);color:var(--sh)}
.btn.wide{width:100%}
.btn:disabled{opacity:1}
.btn.primary:disabled{opacity:.5}
.bar{height:8px;border-radius:3px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent)}
.linkbtn{display:flex;align-items:center;gap:10px;min-height:44px;padding:8px 12px;border:1px solid var(--line2);border-radius:4px;background:var(--card);
  color:var(--accent-text);text-decoration:none;font-weight:600;font-size:15px}
.linkbtn small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.links{display:flex;flex-direction:column;gap:8px;margin:10px 0 0}
@media(min-width:600px){.links{flex-direction:row;flex-wrap:wrap}}

/* ---------- Tổng quan ---------- */
.route{display:flex;flex-direction:column;gap:0}
.route-item{padding:14px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center}
.route-item:first-of-type{border-top:0;padding-top:4px}
.route-item .bar{grid-column:1 / -1}
.route-item .rt{font-weight:700}

/* ---------- Unit ---------- */
.unit-head{margin:0 0 14px}
.unit-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:16px 20px;align-items:start}
.unit-main>:last-child{margin-bottom:0}
@media(min-width:1100px){.unit-grid{grid-template-columns:minmax(0,1fr) 300px}}
.switch{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:0 0 12px}
.switch button{min-height:44px;border:1px solid var(--line2);border-radius:4px;background:var(--card);color:var(--ink2);font-size:15px;padding:4px 8px}
.switch button[aria-current=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
input[type=search]{width:100%;min-height:44px;padding:8px 12px;border:1px solid var(--line2);border-radius:4px;background:var(--card);color:var(--ink);font:inherit;font-size:16px;margin:0 0 12px}

/* thẻ từ vựng */
.v-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:10px 12px}
.v-top>div{min-width:0}
.word,.card h3.word{font-size:32px;line-height:1.1;font-weight:700;margin:4px 0;color:var(--ink)}
@media(min-width:600px){.word,.card h3.word{font-size:40px}}
.ipa{color:var(--ink2);font-size:15px}
.say{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:14px 0}
@media(min-width:600px){.say{display:flex;flex-wrap:wrap}.say .btn{padding:0 18px}}
.meaning{margin:0 0 8px;font-size:16px}
.ex-title{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.ex{padding:14px 0 0;margin-top:14px;border-top:1px solid var(--line)}
.ex-title+.ex{border-top:0;margin-top:0;padding-top:4px}
.ctx{display:inline-block;padding:3px 10px;border-radius:3px;font-size:12.5px;font-weight:600;background:var(--ac-bg);color:var(--ac)}
.ctx.rd{background:var(--rd-bg);color:var(--rd)}.ctx.professional{background:var(--pr-bg);color:var(--pr)}
.ex .en{font-weight:600;font-size:17px;line-height:1.5;margin:8px 0 2px}
.ex .vi{color:var(--muted);font-size:15px;margin:0 0 10px}
.ex-btns{display:flex;flex-wrap:wrap;gap:8px}
.ex-btns>.btn{flex:1 1 44px}
.shadow-wrap{flex:1 1 112px;display:flex;flex-direction:column;gap:6px;min-width:0}
.shadow-wrap .btn{width:100%}
@media(min-width:600px){.ex-btns>.btn{flex:0 0 auto}.shadow-wrap{flex:0 1 auto}}
.shadow-bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.shadow-bar>i{display:block;height:100%;width:0;background:var(--sh)}
.trapnote{margin-top:14px}

/* phản hồi, bẫy Vietlish */
.fb{margin-top:10px;padding:12px 14px;border-radius:4px;font-size:15px;line-height:1.55}
.fb.ok{background:var(--okbox);border:1px solid var(--okline);color:var(--oktext)}
.fb.bad{background:var(--badbg);border:1px solid var(--badline);color:var(--badtext)}
.trap{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
@media(min-width:640px){.trap{grid-template-columns:1fr 1fr}}
.wrong,.right{border-radius:4px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start}
.wrong{background:var(--badbg);border:1px solid var(--badline);color:var(--badtext)}
.right{background:var(--okbox);border:1px solid var(--okline);color:var(--oktext)}
.wrong svg{color:var(--bad);margin-top:2px}.right svg{color:var(--ok);margin-top:2px}
.lab{display:block;font-size:13px;font-weight:700}
.trap .txt{font-size:16px}

/* bài tập */
.ex-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin:0 0 10px}
.ex-head strong{font-size:17px}
.tag{display:inline-block;padding:4px 10px;border-radius:3px;background:var(--chip);color:var(--ink2);font-size:13px}
.tag.done{background:var(--okbg);color:var(--oktext)}
.prompt{font-size:17px;line-height:1.6;margin:0 0 12px}
.opts{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.opts.two{grid-template-columns:repeat(2,minmax(0,1fr))}
@media(min-width:600px){.opts.two{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}}
.opt{display:flex;align-items:center;gap:8px;width:100%;min-height:52px;text-align:left;margin:0;padding:10px 14px;border:1px solid var(--line2);border-radius:4px;background:var(--card);color:var(--ink);font-size:16px;line-height:1.4}
.opts.two .opt{justify-content:center;text-align:center}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{color:var(--ink)}
.opt.ok{background:var(--okbg);border:2px solid var(--ok);color:var(--oktext);font-weight:600}
.opt.bad{background:var(--badbg);border:2px solid var(--bad);color:var(--badtext)}
.cloze{font-size:17px;line-height:1.6;margin:0 0 12px}
button.gap{display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;min-height:44px;min-width:72px;margin:4px;padding:0 10px;
  border:0;border-bottom:2px solid var(--accent);border-radius:4px;background:var(--tint);color:var(--ink);font-weight:600}
button.gap.ok{border-color:var(--ok);background:var(--okbg);color:var(--oktext)}button.gap.bad{border-color:var(--bad);background:var(--badbg);color:var(--badtext)}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.pool .btn:disabled{opacity:.45}
.seg-line{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:17px;margin:0 0 6px}
button.seg{min-height:44px;padding:0 10px;border:1px solid var(--line2);border-radius:4px;background:var(--soft);color:var(--ink);font-size:17px;display:inline-flex;align-items:center;gap:4px}
button.seg sup{font-size:12px;font-weight:700;color:var(--accent-text)}
button.seg.ok{background:var(--okbg);border:2px solid var(--ok);color:var(--oktext)}button.seg.bad{background:var(--badbg);border:2px solid var(--bad);color:var(--badtext)}
button.seg:disabled{color:var(--ink)}
button.seg.ok:disabled{color:var(--oktext)}button.seg.bad:disabled{color:var(--badtext)}
.tilebox{min-height:64px;border:2px dashed var(--line2);border-radius:4px;padding:8px;margin:8px 0;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tilebox.answer{background:var(--soft)}
.tilebox:empty::before{content:attr(data-ph);color:var(--muted);font-size:14px;padding:0 4px}
.tile{min-height:44px;min-width:44px;padding:0 12px;border:1px solid var(--accent);border-radius:4px;background:var(--card);color:var(--ink);font-size:16px}
.tilebox.answer .tile{background:var(--tint)}

/* flashcards 3D */
.fc{perspective:1000px;margin:0 auto 12px;max-width:560px}
.fc-inner{display:grid;min-height:200px;transform-style:preserve-3d;transition:transform .5s;cursor:pointer;border-radius:6px}
.fc.flipped .fc-inner{transform:rotateY(180deg)}
.face{grid-area:1 / 1;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1px solid var(--line2);border-radius:6px;background:var(--card);padding:22px 18px;
  display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:6px;box-shadow:0 1px 2px rgba(17,24,39,.06)}
.face.back{transform:rotateY(180deg);align-items:flex-start;text-align:left;justify-content:flex-start;border-color:var(--accent)}
.face .hint{font-size:13px;color:var(--muted);margin-top:8px}
@media(min-width:600px){.fc-inner{min-height:260px}}
@media(prefers-reduced-motion:reduce){.fc-inner{transition:none}}
.fc-say{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;max-width:560px;margin:0 auto 12px}
.fc-ctl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;max-width:560px;margin:0 auto}
.fc-ctl .two{grid-column:span 3;display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* sơ đồ ghép từ */
.forks{display:flex;flex-direction:column;gap:12px}
.fork-center{align-self:flex-start;background:var(--accent);color:var(--accent-ink);border-radius:4px;padding:8px 16px;font-weight:700;font-size:18px}
.fork-groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.fork-g{background:var(--soft);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:4px;padding:12px 14px}
.fork-g .lab{color:var(--muted);margin:0 0 8px;font-weight:600}
.fork-g .row .btn{font-size:15px}
.tbl{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{background:var(--soft);color:var(--ink2);font-size:13px;font-weight:700}

/* Góc sửa bài */
.rv-list{display:flex;flex-direction:column;gap:8px}
.rv{border:1px solid var(--line);border-radius:4px;padding:12px 14px;background:var(--soft)}
.rv dl{margin:0;display:grid;grid-template-columns:minmax(0,1fr);gap:2px 12px}
@media(min-width:600px){.rv dl{grid-template-columns:140px minmax(0,1fr)}}
.rv dt{font-size:13px;color:var(--muted);font-weight:600}
.rv dd{margin:0 0 6px}
.rv-h{display:flex;align-items:center;gap:8px}
.rv-h.okc svg{color:var(--ok)}.rv-h.badc svg{color:var(--bad)}.rv-h.unk svg{color:var(--muted)}

/* tiến độ bên cạnh */

<script type="application/json" id="spec">{"meta":{"id":"ee-l1-01","title":"Effortless English · Level 1 · Bài 1: Day of the Dead","book":"Effortless English – Original Lessons","series":"Effortless English","level":"Level 1 (A2–B1)","book_url":"https://drive.google.com/file/d/19Zt3f7Fj96SE0PY3eECDfYkcE7knJXnJ/view","note":"Đây là app luyện kèm bài gốc của AJ Hoge: hãy nghe bài gốc bằng các nút nghe bên dưới, còn phần chữ trong app là bản kể lại và câu hỏi tự soạn.","source":{"kind":"effortless","book":"Original Effortless English Lesson · Level 1","unit":"1.1 Day of the Dead","drive_url":"https://drive.google.com/drive/folders/1g-C8L4Pa0TsbsWDhOIj2OhNQhb-Z44XU","audio_links":[{"label":"Bài nghe chính (AJ đọc)","url":"https://drive.google.com/file/d/1oOkCPzytlD2L7lYrHngu2DfN4vXZFxwT/view"},{"label":"Giảng từ vựng","url":"https://drive.google.com/file/d/1XrKytOQo62xRlb_sJcQRRICmzPwTAgF-/view"},{"label":"Mini-story gốc","url":"https://drive.google.com/file/d/1set1lB_AhwUbuUQcQZ0YbRFUWh44l-YD/view"}]}},"units":[{"id":"bai-1","label":"Level 1 · Bài 1","title":"Day of the Dead","goal":"Nghe hiểu bài Day of the Dead của AJ rồi dùng 12 từ và cụm từ chính để kể về một ngày lễ, so sánh hai cách nhìn về cái chết và nói lịch sự về người đã mất.","story":{"title":"Day of the Dead – bản kể lại","intro":"Đây là bản kể lại bằng lời khác, cùng nội dung với bài gốc; hãy nghe bài gốc của AJ trước rồi luyện ở đây.","days":14,"pause_s":5,"plan_note":"Mỗi ngày: nghe “Bài nghe chính (AJ đọc)” (nút ở đầu trang) 2–3 lần, rồi nghe câu chuyện kể lại ở đây. Ngày 1–2: xem cả chữ tiếng Anh và bản dịch tiếng Việt. Từ ngày 3: bấm “Ẩn chữ tiếng Anh”, chỉ nghe, rồi làm mini-story hỏi–đáp và nghe mini-story gốc của AJ. Cuối mỗi tuần (ngày 7 và 14): nghe point of view và làm bài tập. Khi nghe hiểu ngay mà không cần dịch, bấm “Đánh dấu: đã hiểu ngay, không cần dịch”.","main":[{"text":"I get to Guatemala on November 1st, a holiday known as the Day of the Dead.","vi":"Tôi đến Guatemala vào ngày 1 tháng 11, đúng vào Ngày của Người đã khuất (Day of the Dead)."},{"text":"I am curious about this festival, so I head to the cemetery to look around, and it turns out to be really interesting.","vi":"Tôi tò mò về lễ hội này, nên tôi đến nghĩa trang để xem thử, và hóa ra nơi đó rất thú vị."},{"text":"The atmosphere feels cheerful, almost like a big party.","vi":"Không khí ở đó vui tươi, gần như một bữa tiệc lớn."},{"text":"Crowds of people fill the place, and families sit beside the graves of their ancestors.","vi":"Khắp nơi đông nghịt người, và các gia đình ngồi cạnh mộ tổ tiên của mình."},{"text":"They clean the graves and put fresh flowers on them.","vi":"Họ lau dọn các ngôi mộ rồi đặt hoa tươi lên mộ."},{"text":"I wander through the cemetery and admire how beautiful the colorful flowers are.","vi":"Tôi dạo quanh nghĩa trang và say mê ngắm vẻ đẹp của những bông hoa rực rỡ sắc màu."},{"text":"The sky is colorful too, because lots of children are flying kites.","vi":"Bầu trời cũng đầy màu sắc, vì rất nhiều trẻ em đang thả diều."},{"text":"A few families are enjoying a picnic right beside the graves.","vi":"Một vài gia đình đang ngồi ăn picnic ngay cạnh các ngôi mộ."},{"text":"They eat Guatemalan food, drink beer, and chat with each other while everyone laughs and smiles.","vi":"Họ ăn món Guatemala, uống bia và trò chuyện với nhau, ai nấy đều cười nói vui vẻ."},{"text":"In America, cemeteries feel somber and serious.","vi":"Ở Mỹ, nghĩa trang mang không khí ảm đạm và nghiêm trang."},{"text":"We never hold parties or festivals beside graves, and nobody laughs, plays music or flies kites there.","vi":"Chúng tôi không bao giờ tổ chức tiệc hay lễ hội cạnh mộ, và cũng không ai cười đùa, mở nhạc hay thả diều ở đó."},{"text":"Honestly, I prefer the Guatemalan approach to the American one.","vi":"Thật lòng mà nói, tôi thích cách tiếp cận của người Guatemala hơn cách của người Mỹ."},{"text":"I like how they remember and celebrate the people who have passed away.","vi":"Tôi thích cách họ tưởng nhớ và tôn vinh những người đã qua đời."},{"text":"They acknowledge that death is real, while many Americans deny it.","vi":"Họ thừa nhận cái chết là có thật, trong khi nhiều người Mỹ chối bỏ nó."},{"text":"I also like that life and death sit side by side in their cemeteries.","vi":"Tôi cũng thích việc sự sống và cái chết hiện diện cạnh nhau trong nghĩa trang của họ."},{"text":"The name sounds sad, but to me this day teaches people to appreciate life.","vi":"Cái tên nghe thì buồn, nhưng với tôi ngày này dạy người ta biết trân trọng cuộc sống."}],"mini":[{"q":"Did AJ arrive in Guatemala?","a":"Yes, he did.","vi":"Có, anh ấy đã đến."},{"q":"Where did he arrive?","a":"In Guatemala.","vi":"Ở Guatemala."},{"q":"Did he arrive in Mexico?","a":"No, in Guatemala.","vi":"Không, ở Guatemala."},{"q":"Was AJ from Guatemala or from the United States?","a":"He was American.","vi":"Anh ấy là người Mỹ."},{"q":"When did AJ arrive?","a":"On November 1st.","vi":"Vào ngày 1 tháng 11."},{"q":"Did he arrive on November 3rd?","a":"No, on November 1st.","vi":"Không, vào ngày 1 tháng 11."},{"q":"What holiday was it?","a":"The Day of the Dead.","vi":"Ngày của Người đã khuất."},{"q":"Was AJ angry about the holiday?","a":"No, he was curious about it.","vi":"Không, anh ấy tò mò về nó."},{"q":"Who was curious about the holiday?","a":"AJ was.","vi":"AJ tò mò."},{"q":"Was AJ curious about the holiday or about the weather?","a":"About the holiday.","vi":"Về ngày lễ."},{"q":"Did AJ go to the airport?","a":"No, he went to the cemetery.","vi":"Không, anh ấy đã đến nghĩa trang."},{"q":"Where did he go?","a":"To the cemetery.","vi":"Đến nghĩa trang."},{"q":"Why did he go there?","a":"He was curious, so he wanted to see what was happening.","vi":"Anh ấy tò mò nên muốn xem chuyện gì đang diễn ra."},{"q":"Did he find the cemetery boring or interesting?","a":"He found it interesting.","vi":"Anh ấy thấy nơi đó thú vị."},{"q":"Was the atmosphere sad?","a":"No, it was like a party.","vi":"Không, nó giống như một bữa tiệc."},{"q":"What was the atmosphere like?","a":"Like a big party.","vi":"Giống như một bữa tiệc lớn."},{"q":"Was this party atmosphere in a restaurant?","a":"No, it was in the cemetery.","vi":"Không, ở trong nghĩa trang."},{"q":"Were there many people, or only a few?","a":"There were many people.","vi":"Có rất nhiều người."},{"q":"Who sat beside the graves?","a":"Families.","vi":"Các gia đình."},{"q":"Did the families sit under the trees?","a":"No, beside the graves.","vi":"Không, cạnh các ngôi mộ."},{"q":"Whose graves did the families sit beside?","a":"Their ancestors' graves.","vi":"Mộ của tổ tiên họ."},{"q":"What did the families clean?","a":"The graves.","vi":"Các ngôi mộ."},{"q":"What did they put on the graves?","a":"Fresh flowers.","vi":"Hoa tươi."},{"q":"Were the flowers fresh or old?","a":"They were fresh.","vi":"Hoa còn tươi."},{"q":"Did AJ walk through a park?","a":"No, through the cemetery.","vi":"Không, qua nghĩa trang."},{"q":"What did AJ admire?","a":"The colorful flowers.","vi":"Những bông hoa đầy màu sắc."},{"q":"Where were the flowers?","a":"On the graves.","vi":"Trên các ngôi mộ."},{"q":"Was the sky gray or colorful?","a":"It was colorful.","vi":"Bầu trời đầy màu sắc."},{"q":"Why was the sky colorful?","a":"Because lots of kids were flying kites.","vi":"Vì có rất nhiều trẻ em đang thả diều."},{"q":"Who flew kites?","a":"The kids.","vi":"Bọn trẻ."},{"q":"Did the kids fly kites at the beach?","a":"No, in the cemetery.","vi":"Không, trong nghĩa trang."},{"q":"Did some families have a picnic by the graves?","a":"Yes, they did.","vi":"Có, họ đã làm vậy."},{"q":"What did they eat?","a":"Guatemalan food.","vi":"Món ăn Guatemala."},{"q":"Did they eat American food?","a":"No, Guatemalan food.","vi":"Không, món Guatemala."},{"q":"Did they drink beer or milk?","a":"They drank beer.","vi":"Họ uống bia."},{"q":"Where did they eat and drink?","a":"In the cemetery.","vi":"Trong nghĩa trang."},{"q":"Did the families chat with each other?","a":"Yes, they chatted together.","vi":"Có, họ trò chuyện cùng nhau."},{"q":"Did the people laugh and smile?","a":"Yes, they did.","vi":"Có, họ cười nói vui vẻ."},{"q":"Were cemeteries in the United States happy places?","a":"No, they were somber.","vi":"Không, chúng ảm đạm."},{"q":"Were American cemeteries somber or cheerful?","a":"Somber, sad and serious.","vi":"Ảm đạm, buồn và nghiêm trang."},{"q":"Did Americans have parties next to graves?","a":"No, never.","vi":"Không, không bao giờ."},{"q":"Did they have parties in restaurants?","a":"Yes, they did.","vi":"Có, họ có."},{"q":"Did they have parties in houses?","a":"Yes, in houses too.","vi":"Có, ở nhà cũng vậy."},{"q":"Did Americans fly kites in cemeteries?","a":"No, they didn't.","vi":"Không, họ không làm vậy."},{"q":"Did people play music in American cemeteries?","a":"No, they didn't.","vi":"Không, họ không làm vậy."},{"q":"Which approach did AJ prefer?","a":"The Guatemalan approach.","vi":"Cách tiếp cận của người Guatemala."},{"q":"Did AJ prefer the American approach?","a":"No, the Guatemalan one.","vi":"Không, cách của người Guatemala."},{"q":"Who remembered and celebrated the dead?","a":"The Guatemalans.","vi":"Người Guatemala."},{"q":"Did Guatemalans acknowledge death, or did they deny it?","a":"They acknowledged it.","vi":"Họ thừa nhận cái chết."},{"q":"Who denied death?","a":"Many Americans.","vi":"Nhiều người Mỹ."},{"q":"Was there only death in the cemetery?","a":"No, there was life too.","vi":"Không, cũng có sự sống."},{"q":"Did the day also teach people to appreciate life?","a":"Yes, it did.","vi":"Có, đúng vậy."}],"pov":[{"label":"Thì quá khứ","intro":"Cùng câu chuyện, kể lại ở thì quá khứ đơn, ngôi “I”.","sentences":[{"text":"I reached Guatemala on November 1st, a holiday known as the Day of the Dead.","vi":"Tôi đã đến Guatemala vào ngày 1 tháng 11, Ngày của Người đã khuất."},{"text":"I was curious about the festival, so I headed to the cemetery to look around, and it turned out to be really interesting.","vi":"Tôi đã tò mò về lễ hội, nên tôi đến nghĩa trang để xem thử, và hóa ra nơi đó rất thú vị."},{"text":"The atmosphere felt cheerful, almost like a big party.","vi":"Không khí khi đó vui tươi, gần như một bữa tiệc lớn."},{"text":"Crowds of people filled the place, and families sat beside the graves of their ancestors.","vi":"Khắp nơi đông nghịt người, và các gia đình ngồi cạnh mộ tổ tiên của mình."},{"text":"They cleaned the graves and put fresh flowers on them.","vi":"Họ đã lau dọn các ngôi mộ rồi đặt hoa tươi lên mộ."},{"text":"I wandered through the cemetery and admired how beautiful the colorful flowers were.","vi":"Tôi dạo quanh nghĩa trang và say mê ngắm vẻ đẹp của những bông hoa rực rỡ."},{"text":"The sky was colorful too, because lots of children flew kites that day.","vi":"Bầu trời cũng đầy màu sắc, vì hôm đó rất nhiều trẻ em thả diều."},{"text":"A few families had a picnic right beside the graves.","vi":"Một vài gia đình ngồi ăn picnic ngay cạnh các ngôi mộ."},{"text":"They ate Guatemalan food, drank beer, and chatted with each other while everyone laughed and smiled.","vi":"Họ đã ăn món Guatemala, uống bia và trò chuyện với nhau, ai nấy đều cười nói vui vẻ."},{"text":"Back home, cemeteries were somber and serious, and we never held parties beside graves.","vi":"Ở quê nhà, nghĩa trang ảm đạm và nghiêm trang, và chúng tôi không bao giờ tổ chức tiệc cạnh mộ."},{"text":"I preferred the Guatemalan approach to the American one.","vi":"Tôi thích cách tiếp cận của người Guatemala hơn cách của người Mỹ."},{"text":"I liked how they remembered and celebrated the people who had passed away.","vi":"Tôi thích cách họ tưởng nhớ và tôn vinh những người đã qua đời."},{"text":"They acknowledged that death was real, while many Americans denied it.","vi":"Họ thừa nhận cái chết là có thật, trong khi nhiều người Mỹ chối bỏ nó."},{"text":"The name sounded sad, but to me that day taught people to appreciate life.","vi":"Cái tên nghe thì buồn, nhưng với tôi ngày đó dạy người ta biết trân trọng cuộc sống."}]},{"label":"Ngôi thứ ba","intro":"Kể về AJ (he) ở thì hiện tại đơn.","sentences":[{"text":"AJ reaches Guatemala on November 1st, a holiday known as the Day of the Dead.","vi":"AJ đến Guatemala vào ngày 1 tháng 11, Ngày của Người đã khuất."},{"text":"He is curious about the festival, so he heads to the cemetery to look around, and it turns out to be really interesting.","vi":"Anh ấy tò mò về lễ hội, nên đi đến nghĩa trang để xem thử, và hóa ra nơi đó rất thú vị."},{"text":"The atmosphere feels cheerful, almost like a big party.","vi":"Không khí ở đó vui tươi, gần như một bữa tiệc lớn."},{"text":"Crowds of people fill the place, and families sit beside the graves of their ancestors.","vi":"Khắp nơi đông nghịt người, và các gia đình ngồi cạnh mộ tổ tiên của mình."},{"text":"The families clean the graves and put fresh flowers on them.","vi":"Các gia đình lau dọn các ngôi mộ rồi đặt hoa tươi lên mộ."},{"text":"AJ wanders through the cemetery and admires how beautiful the colorful flowers are.","vi":"AJ dạo quanh nghĩa trang và say mê ngắm vẻ đẹp của những bông hoa rực rỡ."},{"text":"The sky is colorful too, because lots of children fly kites there.","vi":"Bầu trời cũng đầy màu sắc, vì rất nhiều trẻ em thả diều ở đó."},{"text":"A few families have a picnic right beside the graves.","vi":"Một vài gia đình ngồi ăn picnic ngay cạnh các ngôi mộ."},{"text":"They eat Guatemalan food, drink beer, and chat with each other while everyone laughs and smiles.","vi":"Họ ăn món Guatemala, uống bia và trò chuyện với nhau, ai nấy đều cười nói vui vẻ."},{"text":"In his country, cemeteries are somber and serious, and people never hold parties beside graves.","vi":"Ở đất nước anh ấy, nghĩa trang ảm đạm và nghiêm trang, và người ta không bao giờ tổ chức tiệc cạnh mộ."},{"text":"He prefers the Guatemalan approach to the American one.","vi":"Anh ấy thích cách tiếp cận của người Guatemala hơn cách của người Mỹ."},{"text":"He likes how they remember and celebrate the people who have passed away.","vi":"Anh ấy thích cách họ tưởng nhớ và tôn vinh những người đã qua đời."},{"text":"They acknowledge that death is real, while many Americans deny it.","vi":"Họ thừa nhận cái chết là có thật, trong khi nhiều người Mỹ chối bỏ nó."},{"text":"To him, the day with the sad-sounding name teaches people to appreciate life.","vi":"Với anh ấy, ngày có cái tên nghe buồn này dạy người ta biết trân trọng cuộc sống."}]}]},"vocab_items":[{"word":"curious about","pos":"adj + prep","ipa":"/ˈkjʊəriəs əˈbaʊt/","meaning_vi":"tò mò về, muốn tìm hiểu về","meaning_en":"wanting to know or learn more about something","native_logic":"Người bản xứ coi “curious” là cảm giác muốn biết thêm, nên theo sau là about + danh từ hoặc từ hỏi (how, why, whether), hoặc to + động từ (curious to see). Đây là cảm xúc tích cực, khác với nghĩa “nhiều chuyện”.","collocations":["be curious about","feel curious about","curious to know why","naturally curious"],"vietlish":"Không nói “curious with” hay “curious of”; luôn dùng “curious about”.","examples":[{"text":"Young children are naturally curious about how the world works.","vi":"Trẻ nhỏ vốn tò mò về cách thế giới vận hành.","context":"academic"},{"text":"I am curious about the source of the extra peak, so I will inject a diluent blank to check it.","vi":"Tôi tò mò về nguồn gốc của pic phụ, nên tôi sẽ tiêm mẫu trắng dung môi pha để kiểm tra.","context":"rd"},{"text":"Several colleagues are curious about the timeline, so I will include it in my email.","vi":"Vài đồng nghiệp tò mò về tiến độ, nên tôi sẽ ghi nó vào email.","context":"professional"}]},{"word":"atmosphere","pos":"n","ipa":"/ˈætməsfɪə/","meaning_vi":"bầu không khí; khí quyển","meaning_en":"the general feeling of a place or an occasion; also the gases around the Earth or around a sample","native_logic":"Người bản xứ dùng atmosphere cho cảm giác chung của một nơi hay một dịp (relaxed, festive, tense), nên hay đi với tính từ chỉ cảm xúc. Trong phòng thí nghiệm, từ này còn chỉ lớp khí bao quanh mẫu (nitrogen atmosphere).","collocations":["a relaxed atmosphere","create an atmosphere","a festive atmosphere","an inert atmosphere","the atmosphere of a place"],"vietlish":"Không nói “the atmosphere is crowded”; hãy nói nơi đó “crowded” và bầu không khí “lively” hoặc “friendly”.","examples":[{"text":"The atmosphere in the lecture hall was relaxed, so students asked many questions.","vi":"Bầu không khí trong giảng đường thoải mái nên sinh viên hỏi rất nhiều.","context":"academic"},{"text":"Store the sample under a nitrogen atmosphere to prevent oxidation during the stress study.","vi":"Hãy bảo quản mẫu trong môi trường khí nitơ để tránh oxy hóa trong nghiên cứu stress.","context":"rd"},{"text":"A friendly atmosphere in the meeting helped the team agree on the plan quickly.","vi":"Bầu không khí thân thiện trong cuộc họp giúp nhóm thống nhất kế hoạch nhanh chóng.","context":"professional"}]},{"word":"admire","pos":"v","ipa":"/ədˈmaɪə/","meaning_vi":"ngưỡng mộ, thán phục; ngắm nhìn một cách thích thú","meaning_en":"to respect and like someone or something for their good qualities, or to look at something with pleasure","native_logic":"Admire là động từ có tân ngữ trực tiếp (admire the view). Muốn nêu lý do ngưỡng mộ thì thêm for (admire her for her honesty); muốn nói ngưỡng mộ cách làm thì dùng admire the way + mệnh đề.","collocations":["admire the view","admire someone for something","greatly admire","admire the way","admire someone's work"],"vietlish":"Không nói “admire about”; dùng “admire + tân ngữ”, và “for” để nêu lý do.","examples":[{"text":"Many students admire the author for her clear and honest style.","vi":"Nhiều sinh viên ngưỡng mộ tác giả vì văn phong rõ ràng và chân thật của bà.","context":"academic"},{"text":"I admire the way this method separates all five impurities in a single run.","vi":"Tôi thán phục cách phương pháp này tách cả năm tạp chất chỉ trong một lần chạy.","context":"rd"},{"text":"Many of us admire our QA manager for staying calm during audits.","vi":"Nhiều người trong chúng tôi ngưỡng mộ trưởng phòng QA vì luôn điềm tĩnh trong các đợt đánh giá.","context":"professional"}]},{"word":"chat with","pos":"v + prep","ipa":"/tʃæt wɪð/","meaning_vi":"trò chuyện (thân mật) với","meaning_en":"to talk in a friendly, informal way with someone","native_logic":"Chat là nói chuyện nhẹ nhàng, không trang trọng, nên người bản xứ hay dùng với have a chat, chat over coffee. Người nghe đi sau giới từ with (hoặc to trong tiếng Anh Anh), không đặt thẳng sau động từ.","collocations":["chat with a colleague","chat with friends over coffee","have a chat with","stop to chat with","chat with each other"],"vietlish":"Không nói “chat each other”; hãy nói “chat with each other”.","examples":[{"text":"During the break, the students chatted with their tutor about the reading list.","vi":"Trong giờ nghỉ, sinh viên trò chuyện với giảng viên về danh sách sách đọc.","context":"academic"},{"text":"I stopped to chat with the instrument engineer about the pump pressure alarm.","vi":"Tôi dừng lại trò chuyện với kỹ sư thiết bị về cảnh báo áp suất bơm.","context":"rd"},{"text":"Could we chat with the supplier for ten minutes before the meeting starts?","vi":"Chúng ta có thể trao đổi với nhà cung cấp mười phút trước khi cuộc họp bắt đầu không?","context":"professional"}]},{"word":"somber","pos":"adj","ipa":"/ˈsɒmbə/","meaning_vi":"ảm đạm, u buồn, nghiêm trang","meaning_en":"serious and sad; dark and gloomy (American spelling; British: sombre)","native_logic":"Somber miêu tả tâm trạng, giọng điệu hoặc không khí nặng nề, trầm lắng, hợp với dịp buồn như tang lễ. Chính tả Mỹ là somber, chính tả Anh là sombre; ở đây dùng chính tả Mỹ.","collocations":["a somber mood","somber news","a somber tone","somber colors","a somber occasion"],"vietlish":"Đừng nhầm “somber” (ảm đạm) với “sober” (tỉnh táo, không say).","examples":[{"text":"The poem has a somber tone because it describes the loss of a whole generation.","vi":"Bài thơ có giọng điệu ảm đạm vì nó tả sự mất mát của cả một thế hệ.","context":"academic"},{"text":"The mood in the lab was somber after the six-month stability results were out of specification.","vi":"Không khí trong phòng lab trầm xuống sau khi kết quả ổn định 6 tháng nằm ngoài tiêu chuẩn.","context":"rd"},{"text":"The manager used a somber tone when she announced the budget cuts.","vi":"Quản lý dùng giọng nghiêm trọng, u buồn khi thông báo việc cắt giảm ngân sách.","context":"professional"}]},{"word":"approach","pos":"n / v","ipa":"/əˈprəʊtʃ/","meaning_vi":"cách tiếp cận, phương pháp; tiến lại gần","meaning_en":"a way of dealing with a situation or a problem; to come near to something","native_logic":"Khi là danh từ, approach đi với to: an approach to + danh từ. Người bản xứ hay thêm tính từ (practical, cautious, step-by-step) để mô tả phong cách làm việc, và dùng động từ take hoặc adopt.","collocations":["take an approach","adopt an approach","a practical approach","an approach to the problem","a step-by-step approach"],"vietlish":"Nói “an approach to the problem”, không nói “an approach about the problem”.","examples":[{"text":"The study takes a mixed-methods approach to the question of language learning.","vi":"Nghiên cứu dùng cách tiếp cận phương pháp hỗn hợp cho câu hỏi về việc học ngôn ngữ.","context":"academic"},{"text":"A risk-based approach to method development saves time in the early stages.","vi":"Cách tiếp cận dựa trên rủi ro trong xây dựng phương pháp giúp tiết kiệm thời gian ở giai đoạn đầu.","context":"rd"},{"text":"Our approach to the audit was to review the highest-risk areas first.","vi":"Cách tiếp cận của chúng tôi với đợt đánh giá là rà soát các khu vực rủi ro cao nhất trước.","context":"professional"}]},{"word":"prefer ... to ...","pos":"v","ipa":"/prɪˈfɜː … tuː/","meaning_vi":"thích ... hơn ...","meaning_en":"to like one thing or person better than another","native_logic":"Prefer so sánh bằng giới từ to chứ không dùng than: prefer A to B. Nếu A và B là hành động thì cả hai cùng dạng V-ing (prefer walking to driving). Khi nói về một lần cụ thể, dùng would prefer to + động từ.","collocations":["prefer tea to coffee","prefer doing A to doing B","would prefer to","strongly prefer","I would prefer not to"],"vietlish":"Không dùng “than” sau prefer A; hãy nói “prefer A to B”. (Chỉ khi dùng prefer to + động từ mới có “rather than”: prefer to walk rather than drive.)","examples":[{"text":"Many students prefer working in small groups to studying alone.","vi":"Nhiều sinh viên thích làm việc theo nhóm nhỏ hơn là học một mình.","context":"academic"},{"text":"We prefer a gradient method to an isocratic one because it separates the late-eluting impurities.","vi":"Chúng tôi thích phương pháp gradient hơn phương pháp đẳng dòng vì nó tách được các tạp chất rửa giải muộn.","context":"rd"},{"text":"I prefer a short email to a long meeting for simple updates.","vi":"Tôi thích một email ngắn hơn một cuộc họp dài cho những cập nhật đơn giản.","context":"professional"}]},{"word":"celebrate","pos":"v","ipa":"/ˈselɪbreɪt/","meaning_vi":"ăn mừng; kỷ niệm; tôn vinh","meaning_en":"to do something enjoyable to mark a special day or a happy event, or to honor someone or something","native_logic":"Celebrate có thể có tân ngữ trực tiếp (celebrate a birthday) và thường đi với with để chỉ người hoặc cách ăn mừng (celebrate with friends). Từ này cũng dùng để tôn vinh cuộc đời một người.","collocations":["celebrate a birthday","celebrate success","celebrate the anniversary of","celebrate with friends","celebrate someone's life"],"vietlish":"Không nói “celebrate for my birthday”; hãy nói “celebrate my birthday”.","examples":[{"text":"Many cultures celebrate the harvest with songs, food and dance.","vi":"Nhiều nền văn hóa ăn mừng mùa gặt bằng ca hát, món ăn và khiêu vũ.","context":"academic"},{"text":"The team celebrated the successful completion of the validation study with a team lunch.","vi":"Cả nhóm ăn mừng việc nghiên cứu thẩm định hoàn thành tốt đẹp bằng một bữa trưa chung.","context":"rd"},{"text":"We will celebrate the company's tenth anniversary with a small event next Friday.","vi":"Chúng tôi sẽ kỷ niệm mười năm thành lập công ty bằng một sự kiện nhỏ vào thứ Sáu tới.","context":"professional"}]},{"word":"pass away","pos":"phrasal verb","ipa":"/pɑːs əˈweɪ/","meaning_vi":"qua đời (cách nói nhẹ nhàng, lịch sự)","meaning_en":"a gentle and polite way of saying “die”","native_logic":"Người bản xứ tránh nói thẳng “die” khi nói về người thân hoặc trong tình huống trang trọng, nên dùng pass away. Đây là nội động từ, không có tân ngữ và không dùng bị động.","collocations":["pass away peacefully","pass away at the age of","pass away last year","those who have passed away","a loved one passed away"],"vietlish":"Không dùng bị động: “He was passed away” là sai; hãy nói “He passed away”.","examples":[{"text":"Interviews were conducted with 30 adults whose mother or father had passed away in the previous two years.","vi":"Các cuộc phỏng vấn được thực hiện với 30 người trưởng thành có cha hoặc mẹ đã qua đời trong hai năm trước đó.","context":"academic"},{"text":"The chemist who developed this method passed away last year, but his detailed notebooks still help us troubleshoot it.","vi":"Nhà hóa học xây dựng phương pháp này đã qua đời năm ngoái, nhưng sổ ghi chép chi tiết của ông vẫn giúp chúng tôi xử lý sự cố của phương pháp.","context":"rd"},{"text":"I am sorry to tell you that our former director passed away on Monday.","vi":"Tôi rất tiếc phải báo rằng cựu giám đốc của chúng ta đã qua đời hôm thứ Hai.","context":"professional"}]},{"word":"acknowledge","pos":"v","ipa":"/əkˈnɒlɪdʒ/","meaning_vi":"thừa nhận; công nhận; xác nhận đã nhận","meaning_en":"to accept or admit that something is true or exists, or to say that you have received something","native_logic":"Acknowledge là thừa nhận một sự thật, một vấn đề hay đóng góp, thường dùng trong văn bản trang trọng. Cấu trúc hay gặp: acknowledge + danh từ, hoặc acknowledge that + mệnh đề; trong email, acknowledge receipt nghĩa là xác nhận đã nhận.","collocations":["acknowledge a problem","acknowledge receipt of","openly acknowledge","acknowledge that","acknowledge someone's contribution"],"vietlish":"Không nói “acknowledge about”; dùng “acknowledge + danh từ” hoặc “acknowledge that …”.","examples":[{"text":"The author acknowledges that the sample size was small.","vi":"Tác giả thừa nhận cỡ mẫu còn nhỏ.","context":"academic"},{"text":"We acknowledge that the method has not yet been tested on aged samples.","vi":"Chúng tôi thừa nhận phương pháp chưa được thử trên các mẫu đã lưu lâu.","context":"rd"},{"text":"Please acknowledge receipt of this email by replying today.","vi":"Vui lòng xác nhận đã nhận email này bằng cách trả lời trong hôm nay.","context":"professional"}]},{"word":"deny","pos":"v","ipa":"/dɪˈnaɪ/","meaning_vi":"phủ nhận; chối bỏ; từ chối không cho","meaning_en":"to say that something is not true, to refuse to accept that something exists, or to refuse to give or allow something (deny access)","native_logic":"Deny đi với danh từ, mệnh đề that hoặc V-ing (deny doing something), nghĩa là không thừa nhận điều gì. Nó là từ trái nghĩa với admit và acknowledge. Cụm there is no denying that nghĩa là “không thể phủ nhận rằng”.","collocations":["deny doing something","deny the claim","deny any involvement","deny access to","there is no denying that"],"vietlish":"Không nói “deny to do”; hãy nói “deny doing something”.","examples":[{"text":"Few scholars deny that climate change is affecting rainfall patterns.","vi":"Rất ít học giả phủ nhận rằng biến đổi khí hậu đang ảnh hưởng đến lượng mưa.","context":"academic"},{"text":"The analyst did not deny making the error, and he repeated the run.","vi":"Kiểm nghiệm viên không chối việc mình đã mắc lỗi, và anh ấy chạy lại mẫu.","context":"rd"},{"text":"We cannot deny that the deadline is tight, but we will meet it.","vi":"Chúng ta không thể phủ nhận hạn chót rất sát, nhưng chúng ta sẽ kịp.","context":"professional"}]},{"word":"appreciate","pos":"v","ipa":"/əˈpriːʃieɪt/","meaning_vi":"trân trọng, biết ơn; đánh giá cao; hiểu rõ giá trị","meaning_en":"to be grateful for something, or to understand how valuable or important it is","native_logic":"Appreciate là động từ có tân ngữ trực tiếp: appreciate your help, không cần giới từ. Khi nhờ vả lịch sự, người bản xứ nói I would appreciate it if you could …. Từ này cũng có nghĩa hiểu được giá trị hay tầm quan trọng của điều gì.","collocations":["appreciate your help","greatly appreciate","appreciate the importance of","appreciate the value of","I would appreciate it if you could"],"vietlish":"Không nói “appreciate about” hay “appreciate for your help”; hãy nói “appreciate your help”.","examples":[{"text":"Students need time to appreciate the full complexity of the problem.","vi":"Sinh viên cần thời gian để hiểu hết sự phức tạp của vấn đề.","context":"academic"},{"text":"It is hard to appreciate the effect of pH on retention until you plot the data.","vi":"Khó mà hiểu rõ ảnh hưởng của pH lên độ lưu cho đến khi bạn vẽ đồ thị số liệu.","context":"rd"},{"text":"I would appreciate it if you could send the draft by Friday.","vi":"Tôi sẽ rất biết ơn nếu bạn có thể gửi bản nháp chậm nhất vào thứ Sáu.","context":"professional"}]}],"word_forks":[{"center":"approach","groups":[{"label":"verb + approach","items":["take an approach","adopt an approach","try a different approach","change our approach"]},{"label":"adjective + approach","items":["a practical approach","a cautious approach","a step-by-step approach","a risk-based approach"]},{"label":"approach + to","items":["an approach to the problem","our approach to testing","a new approach to learning"]}]},{"center":"celebrate","groups":[{"label":"celebrate + noun","items":["celebrate a birthday","celebrate a festival","celebrate success","celebrate the anniversary of"]},{"label":"celebrate + with / by","items":["celebrate with friends","celebrate with a party","celebrate by having dinner together"]},{"label":"celebrate + adverb","items":["celebrate quietly","celebrate together","celebrate publicly"]}]},{"center":"curious","groups":[{"label":"curious + about / to","items":["curious about the holiday","curious about why","curious to see","curious to find out"]},{"label":"adverb + curious","items":["naturally curious","genuinely curious","extremely curious"]},{"label":"curious + noun","items":["a curious child","a curious mind","curious visitors"]}]}],"word_family":[{"noun":"curiosity","verb":"—","adjective":"curious","adverb":"curiously"},{"noun":"admiration","verb":"admire","adjective":"admirable","adverb":"admirably"},{"noun":"celebration","verb":"celebrate","adjective":"celebratory","adverb":"—"},{"noun":"acknowledgment","verb":"acknowledge","adjective":"acknowledged","adverb":"—"},{"noun":"appreciation","verb":"appreciate","adjective":"appreciative","adverb":"appreciatively"}],"vietlish_trap":[{"wrong":"I am curious with this holiday.","right":"I am curious about this holiday.","why":"Tiếng Việt nói “tò mò với/về” nên dễ dịch sai giới từ. Tiếng Anh cố định “curious about” cho đối tượng khiến mình tò mò."},{"wrong":"I prefer the Guatemalan approach than the American one.","right":"I prefer the Guatemalan approach to the American one.","why":"Prefer so sánh bằng giới từ “to”, không dùng “than” như tính từ so sánh hơn (better than). Cấu trúc đúng là prefer A to B."},{"wrong":"I appreciate about your help.","right":"I appreciate your help.","why":"Appreciate là ngoại động từ, nhận tân ngữ trực tiếp, không cần giới từ “about”. Nếu muốn dùng giới từ, hãy đổi sang “thank you for your help”."},{"wrong":"We chatted each other for hours.","right":"We chatted with each other for hours.","why":"Chat là nội động từ nên người cùng trò chuyện phải đứng sau giới từ “with”, giống chữ “với” trong “trò chuyện với nhau”. Đừng bắt chước “meet each other”, “help each other” (ngoại động từ, không cần giới từ)."},{"wrong":"My grandfather was died last year.","right":"My grandfather died last year.","why":"Die là nội động từ, không có dạng bị động, nên không dùng “was died”. Muốn nói nhẹ nhàng, lịch sự hơn, hãy dùng “passed away”: My grandfather passed away last year."}],"exercises":[{"type":"mcq","prompt":"The mood at the funeral was ____: nobody smiled, and everyone spoke in low voices.","options":["festive","noisy","somber","careless"],"answer":2,"explain":"Tang lễ có không khí nặng nề, buồn và nghiêm trang nên chọn “somber”. “Festive” là vui như lễ hội, “noisy” là ồn ào, “careless” là cẩu thả; không từ nào hợp với ngữ cảnh."},{"type":"mcq","prompt":"Today is my sister's birthday, so we are going to ____ with a cake and a small party.","options":["deny","celebrate","appreciate","acknowledge"],"answer":1,"explain":"Ăn mừng sinh nhật bằng bánh và tiệc là “celebrate”. “Deny” là phủ nhận; “appreciate” là trân trọng; “acknowledge” là thừa nhận. Ba từ này không đi với “with a cake and a small party” theo nghĩa ăn mừng."},{"type":"chip_select","prompt":"I prefer the Guatemalan approach ___ the American one, and I am curious ___ their traditions.","chips":["to","about","than","with","of"],"answers":["to","about"],"explain":"Prefer A to B (không dùng “than”) và curious about + danh từ (không dùng “with” hay “of”)."},{"type":"chip_select","prompt":"My grandfather ___ ___ peacefully last year, at the age of ninety.","chips":["passed","away","was","died","off"],"answers":["passed","away"],"explain":"“Pass away” là cách nói nhẹ nhàng thay cho “die”, và là nội động từ nên không dùng “was”. Cụm “died off” không dùng cho một người."},{"type":"error_spot","segments":[{"text":"My brother was"},{"label":"A","text":"very curious"},{"label":"B","text":"with"},{"label":"C","text":"the festival, so he"},{"label":"D","text":"went to see it."}],"answer":"B","correction":"My brother was very curious about the festival, so he went to see it.","explain":"Sau “curious” phải dùng giới từ “about”, không phải “with”. Các phần còn lại đều đúng."},{"type":"error_spot","segments":[{"text":"I think the"},{"label":"A","text":"Guatemalan approach"},{"label":"B","text":"is better,"},{"label":"C","text":"so I prefer it"},{"label":"D","text":"than the American one."}],"answer":"D","correction":"I think the Guatemalan approach is better, so I prefer it to the American one.","explain":"Prefer dùng giới từ “to” để so sánh (prefer A to B), không dùng “than”."},{"type":"register_upgrade","prompt":"Bạn kể với một đồng nghiệp mới quen rằng ông của bạn đã mất. Chọn cách nói nhẹ nhàng, lịch sự thay cho: “My grandfather died last year.”","options":["My grandfather passed away last year.","My grandfather kicked the bucket last year.","My grandfather went belly-up last year."],"answer":0,"explain":"“Passed away” là cách nói trang trọng, nhẹ nhàng về người đã mất. “Kicked the bucket” là thành ngữ đùa cợt, thiếu tôn trọng; “went belly-up” dùng cho doanh nghiệp phá sản."},{"type":"word_formation","prompt":"She wrote a short note of ____ to everyone who helped with the festival.","base":"appreciate","pos":"danh từ","options":["appreciative","appreciatively","appreciate","appreciation"],"answer":3,"explain":"Sau giới từ “of” cần một danh từ: “a note of appreciation” (lời cảm ơn). “Appreciative” là tính từ, “appreciatively” là trạng từ, “appreciate” là động từ."}],"writing_drills":[{"prompt":"Sắp xếp các mảnh thành câu: “Tôi thích cách tiếp cận của người Guatemala hơn cách của người Mỹ.”","tiles":["the Guatemalan approach","I","the American one","prefer","to"],"correct_order":["I","prefer","the Guatemalan approach","to","the American one"],"explain":"Cấu trúc prefer A to B: chủ ngữ I, động từ prefer, đối tượng được thích, giới từ to, rồi đối tượng kém được thích hơn."},{"prompt":"Sắp xếp các mảnh thành câu: “Tôi tò mò về lễ hội nên đã đến nghĩa trang.”","tiles":["so I went","I was","to the cemetery","the festival,","curious about"],"correct_order":["I was","curious about","the festival,","so I went","to the cemetery"],"explain":"Chủ ngữ và động từ (I was), rồi cụm curious about + danh từ, sau đó mệnh đề kết quả với so."},{"prompt":"Sắp xếp các mảnh thành câu: “Ông tôi đã qua đời thanh thản năm ngoái.”","tiles":["last year","passed away","My","peacefully","grandfather"],"correct_order":["My","grandfather","passed away","peacefully","last year"],"alt_orders":[["My","grandfather","peacefully","passed away","last year"]],"explain":"Trạng từ peacefully có thể đứng trước hoặc sau cụm passed away; cụm chỉ thời gian last year đứng cuối câu."}]}]}</script>

function unitScore(u){

/* tổng tiến độ = số bài (trắc nghiệm + lắp ghép câu) đã làm đúng trên tổng số bài */

    t.done+=a.ok+d.ok; t.total+=a.total+d.total; t.known+=k.ok; t.words+=k.total; });

/* danh sách câu: bấm số để nghe một câu, mỗi câu có nút Nhại câu */
function sentenceList(sentences){

  sentences.forEach(function(s,k){
    var no=h('button',{type:'button',class:'btn no','data-acc':'ANY','aria-label':'Nghe câu '+(k+1)+(hide?'':': '+s.text),text:String(k+1),onclick:function(){
      var a=storyAcc(); if(!a) return; stopPlay(); var my=play.tok; mark(k);
      Voice.speak(s.text,a,rate()).then(function(){ if(my===play.tok) unmark(); }); }});
    audioBtns.push(no);
    var txt=h('div',{style:'min-width:0'},[

/* nghe cả bài: đọc lần lượt từng câu, tô câu đang đọc */
function playerCard(title, intro, sentences, testid){
  var c=h('div',{class:'card','data-testid':testid});
  c.appendChild(h('h3',{text:title}));
  if(intro) c.appendChild(h('p',{class:'small muted',text:intro}));
  var L=sentenceList(sentences);
  var status=h('p',{class:'mini-status',role:'status',text:sentences.length+' câu · bấm "Nghe cả bài" hoặc bấm số để nghe từng câu'});
  var bp=h('button',{type:'button',class:'btn primary','data-acc':'ANY','data-testid':'play-all',onclick:function(){
    var a=storyAcc(); if(!a) return; stopPlay(); var my=play.tok, i=0; bp.disabled=true;
    (function next(){
      if(my!==play.tok){ L.unmark(); bp.disabled=false; return; }
      if(i>=L.texts.length){ L.unmark(); bp.disabled=false; status.textContent='Đã nghe hết '+L.texts.length+' câu. Nghe lại nhiều lần, đến khi hiểu ngay không cần dịch.'; return; }
      var k=i++; L.mark(k); status.textContent='Đang đọc câu '+(k+1)+'/'+L.texts.length+' (giọng '+a+')';
      Voice.speak(L.texts[k],a,rate()).then(function(){ return wait(400); }).then(next);
    })(); }},[ icon('speaker',18), 'Nghe cả bài' ]);
  var bs=h('button',{type:'button',class:'btn','data-acc':'ANY','data-testid':'play-stop',onclick:function(){ stopPlay(); status.textContent='Đã dừng.'; }},'Dừng');
  audioBtns.push(bp); audioBtns.push(bs);
  c.appendChild(h('div',{class:'st-tools'},[bp,bs])); c.appendChild(status); c.appendChild(L.el);

}

function renderPov(box,u){

/* mini-story: nghe câu hỏi → dừng để trả lời to → nghe câu trả lời mẫu → câu kế tiếp */
var PAUSES=[3,5,8];
function renderMini(box,u){
  var items=u.story.mini, hide=storyHide(), novi=storyNoVi();
  var pz=store.get('mini_pause',null); if(PAUSES.indexOf(pz)<0) pz=PAUSES.indexOf(u.story.pause_s)>=0?u.story.pause_s:5;
  var posMap=store.get('mini_pos',{}), pos=posMap[u.id]; if(typeof pos!=='number'||pos<0||pos>=items.length) pos=0;
  var c=h('div',{class:'card','data-testid':'story-mini'});
  c.appendChild(h('h3',{text:'Mini-story hỏi–đáp ('+items.length+' câu)'}));
  c.appendChild(h('p',{class:'small muted',text:'Nghe câu hỏi, trả lời to thật nhanh trong lúc thanh màu cam chạy, rồi nghe câu trả lời mẫu. Trả lời ngắn một hai chữ cũng được, miễn là nói ngay.'}));
  c.appendChild(h('div',{class:'row',role:'group','aria-label':'Thời gian để bạn trả lời'},[ h('span',{class:'small',text:'Thời gian trả lời:'}) ].concat(PAUSES.map(function(s){
    return h('button',{type:'button',class:'btn'+(s===pz?' primary':''),'aria-pressed':s===pz?'true':'false',text:s+' giây',onclick:function(){ store.set('mini_pause',s); render(); }}); }))));
  var counter=h('div',{class:'eyebrow','data-testid':'mini-counter'}), q=h('p',{class:'mini-q'}), status=h('p',{class:'mini-status',role:'status'});
  var bar=h('div',{class:'bar cd hide','aria-hidden':'true'},h('i')), ans=h('div',{class:'fb ok hide','data-testid':'mini-answer'});
  function show(k){
    pos=k; var m=store.get('mini_pos',{}); m[u.id]=k; store.set('mini_pos',m);
    counter.textContent='Câu '+(k+1)+' / '+items.length;
    q.className='mini-q'+(hide?' hid':''); q.textContent=hide?'Đang ẩn chữ: nghe câu hỏi rồi trả lời to':items[k].q;
    clear(ans); ans.classList.add('hide'); bar.classList.add('hide');
  }
  function reveal(k){
    clear(ans);
    if(hide){ ans.appendChild(h('span',{text:'Đã đọc câu trả lời mẫu (đang ẩn chữ).'})); }
    else { ans.appendChild(h('strong',{text:items[k].a})); if(items[k].vi && !novi) ans.appendChild(h('div',{class:'small',text:items[k].vi})); }
    ans.classList.remove('hide');
  }
  function run(from){
    var a=storyAcc(); if(!a) return; stopPlay(); var my=play.tok;
    function alive(){ return my===play.tok; }
    function step(k){
      if(!alive()) return;
      if(k>=items.length){ status.textContent='Hết mini-story. Bấm "Từ đầu" để làm lại, nhanh hơn lần trước.'; return; }
      show(k); status.textContent='Nghe câu hỏi…';
      Voice.speak(items[k].q,a,rate()).then(function(){
        if(!alive()) return;
        status.textContent='Đến lượt bạn: trả lời to!'; bar.classList.remove('hide');
        var f=bar.firstChild; f.style.transition='none'; f.style.width='0'; void f.offsetWidth; f.style.transition='width '+(pz*1000)+'ms linear'; f.style.width='100%';
        return wait(pz*1000);
      }).then(function(){
        if(!alive()) return;
        bar.classList.add('hide'); status.textContent='Câu trả lời mẫu:'; reveal(k);
        return Voice.speak(items[k].a,a,rate());
      }).then(function(){ if(alive()) return wait(700); }).then(function(){ step(k+1); });
    }
    step(from);
  }
  var bStart=h('button',{type:'button',class:'btn primary','data-acc':'ANY','data-testid':'mini-start',onclick:function(){ run(pos); }},[ icon('speaker',18), 'Bắt đầu từ câu này' ]);
  var bStop=h('button',{type:'button',class:'btn','data-acc':'ANY','data-testid':'mini-stop',onclick:function(){ stopPlay(); bar.classList.add('hide'); status.textContent='Đã dừng ở câu '+(pos+1)+'.'; }},'Dừng');
  var bPrev=h('button',{type:'button',class:'btn','aria-label':'Câu trước',onclick:function(){ stopPlay(); show(Math.max(0,pos-1)); status.textContent='Bấm "Bắt đầu từ câu này" để nghe.'; }},[ icon('left',18), 'Câu trước' ]);
  var bNext=h('button',{type:'button',class:'btn','aria-label':'Câu sau','data-testid':'mini-next',onclick:function(){ stopPlay(); show(Math.min(items.length-1,pos+1)); status.textContent='Bấm "Bắt đầu từ câu này" để nghe.'; }},[ 'Câu sau', icon('right',18) ]);
  var bFirst=h('button',{type:'button',class:'btn',onclick:function(){ stopPlay(); show(0); run(0); }},[ icon('redo',18), 'Từ đầu' ]);
  audioBtns.push(bStart); audioBtns.push(bStop);
  var boxQ=h('div',{class:'mini-box'},[ counter, q, status, bar, ans ]);
  c.appendChild(boxQ);
  c.appendChild(h('div',{class:'st-tools'},[ bStart, bStop, bPrev, bNext, bFirst ]));
  /* xem cả danh sách (khi muốn đọc lại) */
  var listOpen=false, listEl=h('ol',{class:'mini-list hide'});
  items.forEach(function(m){ listEl.appendChild(h('li',{},[ h('span',{text:m.q}), h('span',{class:'a',text:m.a}) ])); });
  var bList=h('button',{type:'button',class:'btn','aria-expanded':'false',onclick:function(){ listOpen=!listOpen; listEl.classList.toggle('hide',!listOpen);
    bList.setAttribute('aria-expanded',listOpen?'true':'false'); bList.textContent=listOpen?'Ẩn danh sách câu hỏi':'Xem cả danh sách câu hỏi'; }},'Xem cả danh sách câu hỏi');
  c.appendChild(h('div',{class:'row'},bList)); c.appendChild(listEl);
  show(pos); status.textContent='Bấm "Bắt đầu từ câu này" để nghe.';
  box.appendChild(c);
}

    var v=items[order[pos]];
    var nk=items.filter(function(_,i){ return known[u.id+':'+i]; }).length;
    holder.appendChild(h('p',{class:'muted small',style:'text-align:center;margin:0 0 10px',text:'Thẻ '+(pos+1)+'/'+items.length+' · đã nhớ '+nk+'/'+items.length}));

    var back=h('div',{class:'face back'},[ h('strong',{style:'font-size:18px',text:v.meaning_vi||''}), v.meaning_en?h('div',{class:'muted',text:v.meaning_en}):null,

    var card=h('div',{class:'fc'+(flipped?' flipped':'')},h('div',{class:'fc-inner',tabindex:'0',role:'button','aria-label':'Lật thẻ '+v.word,
      onclick:function(){ flipped=!flipped; card.classList.toggle('flipped',flipped); },
      onkeydown:function(e){ if(e.key===' '||e.key==='Enter'){ e.preventDefault(); flipped=!flipped; card.classList.toggle('flipped',flipped); } } },[front,back]));
    holder.appendChild(card);
    holder.appendChild(h('div',{class:'fc-say',role:'group','aria-label':'Nghe từ '+v.word},[ speakBtn('UK','Từ',v.word,'tint'), speakBtn('US','Từ',v.word,'tint'), speakBtn('IN','Từ',v.word,'tint') ]));
    function mark(val){ known[u.id+':'+order[pos]]=val; store.set('flash',known); progressChanged(); refreshAside(); pos=(pos+1)%order.length; flipped=false; draw(); }

        h('button',{type:'button',class:'btn primary',onclick:function(){ mark(true); }},[ icon('check',18), 'Đã nhớ' ]) ]) ]);
    holder.appendChild(ctl); refreshAudio();

function renderForks(box,u){
  var any=false;
  (u.word_forks||[]).forEach(function(f){
    any=true;
    var c=h('div',{class:'card'}); c.appendChild(h('h3',{text:'Sơ đồ ghép từ: '+f.center}));
    var groups=h('div',{class:'fork-groups'});
    (f.groups||[]).forEach(function(g){
      var gi=h('div',{class:'fork-g'}); gi.appendChild(h('span',{class:'lab',text:g.label}));
      var row=h('div',{class:'row'});
      (g.items||[]).forEach(function(it){ var txt=typeof it==='string'?it:it.text; row.appendChild(h('button',{type:'button',class:'btn','aria-label':'Nghe: '+txt,onclick:function(){ var a=Voice.preferred(); if(a) Voice.speak(txt,a,rate()); }},[ icon('speaker',14), txt ])); });
      gi.appendChild(row); groups.appendChild(gi);
    });
    c.appendChild(h('div',{class:'forks'},[ h('div',{class:'fork-center',text:f.center}), groups ])); box.appendChild(c);
  });
  if((u.word_family||[]).length){
    any=true;
    var c2=h('div',{class:'card'}); c2.appendChild(h('h3',{text:'Bảng họ từ (Word family)'}));
    var tb=h('table'); var tr=h('tr'); ['Danh từ','Động từ','Tính từ','Trạng từ'].forEach(function(x){ tr.appendChild(h('th',{scope:'col',text:x})); }); tb.appendChild(h('thead',{},tr));
    var body=h('tbody');
    u.word_family.forEach(function(w){ var r=h('tr'); ['noun','verb','adjective','adverb'].forEach(function(k){ r.appendChild(h('td',{text:w[k]||'—'})); }); body.appendChild(r); });
    tb.appendChild(body); c2.appendChild(h('div',{class:'tbl'},tb)); box.appendChild(c2);
  }
  if(!any) box.appendChild(h('p',{class:'muted',text:'Unit này chưa có sơ đồ ghép từ.'}));
}

function renderVietlish(box,u){
  var arr=u.vietlish_trap||[];
  if(!arr.length){ box.appendChild(h('p',{class:'muted',text:'Unit này chưa có cảnh báo Vietlish.'})); return; }
  arr.forEach(function(t){
    var c=h('div',{class:'card'});
    c.appendChild(h('div',{class:'trap'},[
      h('div',{class:'wrong'},[ icon('x',20), h('div',{},[ h('span',{class:'lab',text:'Hay nói sai'}), h('span',{class:'txt',text:t.wrong}) ]) ]),
      h('div',{class:'right'},[ icon('check',20), h('div',{},[ h('span',{class:'lab',text:'Nên nói'}), h('span',{class:'txt',text:t.right}) ]) ]) ]));
    if(t.why) c.appendChild(h('p',{class:'small',style:'margin:12px 0 0',text:t.why}));
    box.appendChild(c);
  });
}

/* ---------- Bài tập (5 dạng bấm/chọn) ---------- */
function practiceSwitch(box,u){
  var nx=(u.exercises||[]).length, nd=(u.writing_drills||[]).length;
  box.appendChild(h('div',{class:'switch',role:'group','aria-label':'Chọn loại bài'},[
    h('button',{type:'button','aria-current':state.sub==='exercises'?'true':'false',onclick:function(){ state.sub='exercises'; render(); },text:'Bài tập ('+nx+')'}),
    h('button',{type:'button','aria-current':state.sub==='drills'?'true':'false',onclick:function(){ state.sub='drills'; render(); },text:'Xưởng viết câu ('+nd+')'}) ]));
}
var TYPE_LABEL={mcq:'Trắc nghiệm theo ngữ cảnh',chip_select:'Bấm ghép mảnh Collocation',error_spot:'Bắt lỗi trong câu',register_upgrade:'Nâng cấp văn phong',word_formation:'Phái sinh từ'};
function feedback(ok,msg){ return h('div',{class:'fb '+(ok?'ok':'bad'),role:'status'},[ h('strong',{text:ok?'Đúng. ':'Chưa đúng. '}), msg||'' ]); }
function renderExercises(box,u){
  practiceSwitch(box,u);
  var list=u.exercises||[];
  var sc=unitScore(u);
  var head=h('div',{class:'card'},[ h('div',{class:'prog-row'},[ h('strong',{text:'Tiến độ: '+sc.ok+'/'+sc.total+' câu đúng'}), h('span',{text:pct(sc)+'%'}) ]), h('div',{class:'bar'},h('i',{style:'width:'+pct(sc)+'%'})) ]);
  box.appendChild(head);
  list.forEach(function(ex,i){ box.appendChild(exerciseCard(u,ex,i,list.length,function(){ var s=unitScore(u); head.firstChild.firstChild.textContent='Tiến độ: '+s.ok+'/'+s.total+' câu đúng'; head.firstChild.lastChild.textContent=pct(s)+'%'; head.lastChild.firstChild.style.width=pct(s)+'%'; refreshAside(); })); });
  box.appendChild(h('button',{type:'button',class:'btn',onclick:function(){ list.forEach(function(_,i){ delete results[u.id+':ex:'+i]; }); store.set('results',results); progressChanged(); render(); }},[ icon('redo',18), 'Làm lại toàn bộ Unit' ]));
}
function exerciseCard(u,ex,i,n,onDone){
  var key=u.id+':ex:'+i;
  var c=h('article',{class:'card','data-type':ex.type});
  c.appendChild(h('div',{class:'ex-head'},[ h('strong',{text:'Bài '+(i+1)+' / '+n}), h('div',{class:'row'},[ h('span',{class:'tag',text:TYPE_LABEL[ex.type]||ex.type}), results[key]===true?h('span',{class:'tag done',text:'Đã đúng'}):null ]) ]));
  var body=h('div'); c.appendChild(body);
  function done(ok,msg){ setResult(key,ok); body.appendChild(feedback(ok,msg)); onDone(); }
  var t=ex.type;
  if(t==='mcq'||t==='register_upgrade'||t==='word_formation'){
    if(t==='word_formation'&&ex.base) body.appendChild(h('p',{class:'small muted',text:'Từ gốc: '+ex.base+(ex.pos?' → cần '+ex.pos:'')}));
    body.appendChild(h('p',{class:'prompt',text:ex.prompt}));
    var btns=[];
    var short=ex.options.every(function(o){ return String(o).length<=18; });
    var grid=h('div',{class:'opts'+(short?' two':'')});
    ex.options.forEach(function(o,k){
      var b=h('button',{type:'button',class:'opt',onclick:function(){
        btns.forEach(function(x){ x.disabled=true; });
        btns[ex.answer].classList.add('ok'); btns[ex.answer].insertBefore(icon('check',18),btns[ex.answer].firstChild);
        if(k!==ex.answer){ b.classList.add('bad'); b.insertBefore(icon('x',18),b.firstChild); }
        done(k===ex.answer, ex.explain);
        if(ex.speak){ /* không tự phát âm */ }
      }},h('span',{text:o})); btns.push(b); grid.appendChild(b);
    });
    body.appendChild(grid);
  } else if(t==='chip_select'){
    var parts=String(ex.prompt).split('___'); var answers=ex.answers; var filled=answers.map(function(){ return null; });
    var p=h('p',{class:'cloze'}); var gaps=[];
    var chipBox=h('div',{class:'pool',role:'group','aria-label':'Các mảnh để chọn'}), chips=[], locked=false, warn=null;
    parts.forEach(function(s,k){ p.appendChild(document.createTextNode(s)); if(k<parts.length-1){ var g=h('button',{type:'button',class:'gap','aria-label':'Chỗ trống '+(k+1),text:'…',
      onclick:function(){ if(locked) return; if(filled[k]!==null){ chips[filled[k]].disabled=false; filled[k]=null; g.textContent='…'; } }}); gaps.push(g); p.appendChild(g); } });
    body.appendChild(p);
    ex.chips.forEach(function(w,k){ var b=h('button',{type:'button',class:'btn',text:w,onclick:function(){ if(locked) return; var j=filled.indexOf(null); if(j<0) return; filled[j]=k; gaps[j].textContent=w; b.disabled=true; }}); chips.push(b); chipBox.appendChild(b); });
    body.appendChild(chipBox);
    var chk=h('button',{type:'button',class:'btn primary',text:'Kiểm tra',onclick:function(){
      if(filled.indexOf(null)>=0){ if(warn&&warn.parentNode) warn.parentNode.removeChild(warn); warn=h('div',{class:'fb bad',text:'Hãy điền hết các chỗ trống trước khi kiểm tra.'}); body.appendChild(warn); return; }
      if(warn&&warn.parentNode) warn.parentNode.removeChild(warn);
      locked=true; chk.disabled=true; var all=true;
      filled.forEach(function(k,j){ var ok=norm(ex.chips[k])===norm(answers[j]); gaps[j].classList.add(ok?'ok':'bad'); if(!ok) all=false; });
      done(all,(all?'':'Đáp án: '+answers.join(' / ')+'. ')+(ex.explain||''));
    }}); body.appendChild(chk);
  } else if(t==='error_spot'){
    body.appendChild(h('p',{class:'small muted',text:'Bấm vào phần chứa lỗi sai.'}));
    var line=h('div',{class:'seg-line'}); var segBtns=[];
    ex.segments.forEach(function(s){
      if(s.label){ var b=h('button',{type:'button',class:'seg','aria-label':'Phần '+s.label+': '+s.text,onclick:function(){
        segBtns.forEach(function(x){ x.b.disabled=true; });
        var ok=s.label===ex.answer; segBtns.forEach(function(x){ if(x.l===ex.answer) x.b.classList.add('ok'); }); if(!ok) b.classList.add('bad');
        done(ok,(ex.correction?'Câu đúng: '+sentence(ex.correction):'')+(ex.explain||''));
      }},[ h('sup',{text:s.label}), s.text ]); segBtns.push({b:b,l:s.label}); line.appendChild(b); }
      else { line.appendChild(h('span',{class:'seg-txt',text:s.text})); }
    });
    body.appendChild(line);
  }
  return c;
}

/* ---------- Xưởng lắp ghép câu ---------- */
function renderDrills(box,u){
  practiceSwitch(box,u);
  var arr=u.writing_drills||[];
  if(!arr.length){ box.appendChild(h('p',{class:'muted',text:'Unit này chưa có bài lắp ghép câu.'})); return; }
  arr.forEach(function(d,i){
    var key=u.id+':drill:'+i;
    var c=h('article',{class:'card','data-type':'drill'});
    c.appendChild(h('div',{class:'ex-head'},[ h('strong',{text:'Lắp ghép '+(i+1)}), results[key]===true?h('span',{class:'tag done',text:'Đã đúng'}):null ]));
    c.appendChild(h('p',{class:'prompt',text:d.prompt}));
    var answer=h('div',{class:'tilebox answer','aria-label':'Câu của bạn','data-ph':'Bấm các mảnh bên dưới theo đúng thứ tự'}), pool=h('div',{class:'tilebox','aria-label':'Các mảnh'});
    var placed=[]; var tiles=[]; var locked=false;
    var order=shuffle(d.tiles.map(function(_,k){ return k; }));
    if(d.tiles.length>1){ var tries=0; while(order.map(function(k){ return d.tiles[k]; }).join('|')===d.correct_order.join('|') && tries<10){ order=shuffle(order); tries++; } }
    order.forEach(function(k){
      var t=h('button',{type:'button',class:'tile',text:d.tiles[k],onclick:function(){ if(locked) return; if(t.parentNode===pool){ answer.appendChild(t); placed.push(t); } else { pool.appendChild(t); placed.splice(placed.indexOf(t),1); } }});
      tiles.push(t); pool.appendChild(t);
    });
    var out=h('div');
    var chk=h('button',{type:'button',class:'btn primary',text:'Kiểm tra',onclick:function(){
      var cur=placed.map(function(t){ return t.textContent; });
      if(cur.length!==d.tiles.length){ clear(out); out.appendChild(h('div',{class:'fb bad',text:'Hãy dùng hết các mảnh để lắp thành câu.'})); return; }
      var s=norm(cur.join(' ')), ok=norm(d.correct_order.join(' '))===s || (d.alt_orders||[]).some(function(a){ return norm(a.join(' '))===s; });
      locked=true; chk.disabled=true; setResult(key,ok); refreshAside(); clear(out);
      var full=d.correct_order.join(' ');
      out.appendChild(feedback(ok,(ok?'':'Câu mẫu: '+sentence(full))+(d.explain||'')));
      out.appendChild(h('div',{class:'row',style:'margin-top:10px'},[ speakBtn('UK','Câu',full), speakBtn('US','Câu',full), speakBtn('IN','Câu',full) ])); refreshAudio();
    }});
    var reset=h('button',{type:'button',class:'btn',onclick:function(){ delete results[key]; store.set('results',results); progressChanged(); render(); }},[ icon('redo',18), 'Làm lại' ]);
    c.appendChild(answer); c.appendChild(pool); c.appendChild(h('div',{class:'row'},[chk,reset])); c.appendChild(out); box.appendChild(c);
  });
}

/* ---------- khởi động ---------- */
document.getElementById('app-title').textContent=META.title||'Học tiếng Anh';
document.title=META.title||document.title;
if(META.demo===true) document.getElementById('demo').classList.remove('hide');
var theme=store.get('theme',null);
if(!theme){ try{ theme=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'; }catch(e){ theme='light'; } }
var themeBtn=document.getElementById('theme');
function paintTheme(){
  document.documentElement.setAttribute('data-theme',theme); clear(themeBtn);
  themeBtn.appendChild(icon(theme==='dark'?'sun':'moon',18));
  themeBtn.appendChild(h('span',{class:'t-lbl',text:theme==='dark'?'Chế độ sáng':'Chế độ tối'}));
}
paintTheme();
themeBtn.addEventListener('click',function(){ theme=theme==='dark'?'light':'dark'; paintTheme(); store.set('theme',theme); });
var pos=store.get('pos',null);
if(pos && typeof pos.unit==='string'){ state.unit=pos.unit; state.sub=({story:1,vocab:1,flash:1,forks:1,vietlish:1,exercises:1,drills:1})[pos.sub]?pos.sub:firstSub(unitById(pos.unit)); }
Voice.whenReady().then(refreshAudio);
render();
hubWrite();
window.__ECB_READY__=true;
})();
</script>
